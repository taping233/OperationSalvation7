<h1>营地室内重排 · 布局与光照</h1>

<ol><li>斜桌与叠放文件形成中景焦点；入口装备、饮水、寝具各有使用区。</li><li>左窗冷漫射主光、桌面局部暖白光、右炉近处暖反光；阴影同向、接触明确。</li><li>颜色来自材料与使用区域；不加装饰符号，不用全屋统一滤镜。</li></ol>
