<!doctype html><meta charset="utf-8"><title>其他界面的实际素材参考</title><style>body{margin:24px;background:#080b0d;color:#eee;font:15px/1.6 system-ui,sans-serif}h1{font-size:27px}h2{font-size:23px;margin-top:40px}a{color:#a7d6df}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0;padding:14px;border:1px solid #354048;background:#000}.picture{height:310px;display:flex;align-items:center;justify-content:center}.picture a{width:100%;height:100%;display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain}figcaption{font-size:18px;font-weight:600;margin-top:12px}p{margin:8px 0;color:#c6d0d5}small{color:#94a1aa}nav{display:flex;gap:22px;flex-wrap:wrap}</style><h1>其他界面的实际素材参考</h1><p>素材研究参考板：实机截图与官网宣传切图分开标注。点击图片看原图；图中版本、标注覆盖与适用边界见说明。未修改游戏、未测试。</p><nav><a href="#map-navigation">地图与导航</a><a href="#roster-entry">选人、整备、入城与事件</a><a href="#battle">战斗主界面与附加界面</a><a href="#shop-reward-bag">商店、奖励、宝箱与背包</a></nav><section id="map-navigation"><h2>地图与导航</h2><div class="grid"><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" alt="IS7事件整页"></a></div><figcaption>IS7事件整页</figcaption><p>地图顶/底工具与事件选项</p><small>1080 x 485 | new | Player in-game screenshot from TapTap post modified July 19; source URL dated 2026-07-20; exact patch unlabelled</small><p>最新主题实机：顶部持续资源、左叙事右三选项、底部连续收藏/零件/队伍。不是节点原件或官方图解。</p><a href="https://img2-tc.tapimg.com/moment/etag/FoSl1WbPlNMC4t77BV9Gdepq5bw3_20260720001135.jpg/_tap_ugc.jpg" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/02.jpg" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/02.jpg" alt="IS7不可达节点"></a></div><figcaption>IS7不可达节点</figcaption><p>地图选中信息与不可用状态</p><small>1080 x 485 | new | Player in-game screenshot from TapTap post modified July 19; source URL dated 2026-07-20; exact patch unlabelled</small><p>地图圆形地点与低对比路径；右侧具体名称/说明/敌方与地图入口，底右不可达状态；顶/底工具保持连续。</p><a href="https://img2-tc.tapimg.com/moment/etag/FtqvsVw6od0ugHSpx2eydtFTBEh9_20260720001140.jpg/_tap_ugc.jpg" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/02.jpg" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/03.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/03.png" alt="官网光效遮片"></a></div><figcaption>官网光效遮片</figcaption><p>黑底光点与光晕</p><small>391 x 917 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>颗粒密度由实到虚、大片留空；是网页预加载光效，不是游戏地图背景。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/preload/light.22a4ad.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/03.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/04.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/04.png" alt="官网状态承托"></a></div><figcaption>官网状态承托</figcaption><p>顶部资源块</p><small>510 x 546 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>不规则深色折面与切口；网页状态区域原件，可研究信息承托边界。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/preload/status-bg.ad1208.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/04.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/05.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/05.png" alt="官网按钮高亮"></a></div><figcaption>官网按钮高亮</figcaption><p>选中/进入反馈</p><small>403 x 344 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>偏侧辉光和颗粒边缘，需按真实alpha黑底合成判断，不能照RGB透明区色块。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/button-highlight.ccbd82.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/05.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/06.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/06.png" alt="官网主导航图形"></a></div><figcaption>官网主导航图形</figcaption><p>导航装饰层次</p><small>462 x 302 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>多尺度圆形、少量细线/光点与局部光色；网页主题图形，非底部游戏工具栏。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/main_nav.e0998e.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/06.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/07.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/07.png" alt="官网条目承托"></a></div><figcaption>官网条目承托</figcaption><p>节点详情列表</p><small>350 x 135 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>横向透明承托小图，研究局部承托与边缘渐隐，不做游戏原件身份声明。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/detail_list_item_bg.ca3a94.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/07.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/08.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/08.png" alt="官网菜单选中底纹"></a></div><figcaption>官网菜单选中底纹</figcaption><p>选中状态</p><small>1301 x 243 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>狭长圆角底纹的颗粒/alpha变化，仅网页选中素材。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/menu_item_active_bg.7a5d50.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/08.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/09.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/09.png" alt="官网档案物件背景"></a></div><figcaption>官网档案物件背景</figcaption><p>信息面板材质对照</p><small>817 x 793 | new | Official IS7 promotional website image asset, not in-game UI texture</small><p>完整文件夹、照片、笔的物件关系；只作对照，不用于老板要求的黑底地图壁纸。</p><a href="https://web.hycdn.cn/arknights/is/assets/img/bg-rogue.d0a1f8.png" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/09.png" target="_blank">原图</a></figure></div></section><section id="roster-entry"><h2>选人、整备、入城与事件</h2><div class="grid"><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/10.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/10.png" alt="RE01 星铁队伍选人实机"></a></div><figcaption>RE01 星铁队伍选人实机</figcaption><p>选人候选头像/当前人物/查看与确认</p><small>1920 x 1080 | reused | 玩家实机截图库；版本和拍摄日期未标注，早期角色/等级画面；不是官方独立立绘或UI工程</small><p>左侧三张头像卡共用固定框，白亮选中边框与角色右侧展示对应；底部Details与Add独立。本项目对应五人头像、换人时保外壳和查看/确认分工，不复制3D人物或星空风格。</p><a href="https://interfaceingame.com/screenshots/honkai-star-rail-team-selection/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/10.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/11.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/11.png" alt="RE02 绝区零VR训练敌人编排实机"></a></div><figcaption>RE02 绝区零VR训练敌人编排实机</figcaption><p>布局辅助：空槽/敌人候选/固定确认区</p><small>1546 x 857 | new | HoYoLAB社区作者uid370699319的VR Gameplay Introduction实机教学原上传；2024-07-05。画面为VR训练敌人编排/自定义计划，候选是Tyrfing、Alpeca、Hoplital等敌人，底部为Battery Cost与Save Plan；不是玩家出征携带或仓库。非官方独立UI源。</small><p>仅借鉴左空槽、右敌人候选与底部固定确认的布局；不能作为本项目实际携带、容量或资源回执证据，不移植敌人编排/训练电量规则。</p><a href="https://www.hoyolab.com/article/30636268" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/11.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/12.jpg" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/12.jpg" alt="RE03 STS2 Neow开局实机"></a></div><figcaption>RE03 STS2 Neow开局实机</figcaption><p>完整入城页主焦点/持续资源/奖励区域</p><small>1920 x 1080 | reused | PC Gamer实机文章的Mega Crit版权截图；画面右上v0.98.2与2026-03-09；非官方独立UI图层</small><p>角色大主体覆盖全屏中央，名字/短对白形成阅读焦点；顶部资源持续可见，三条奖励放下方暗色承托。本项目只对应入城完整页/已获职业卡/唯一继续，不移植Neow身份和三选一。</p><a href="https://www.pcgamer.com/games/roguelike/slay-the-spire-2-early-access-features/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/12.jpg" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/13.jpg" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/13.jpg" alt="RE04 STS2 Ranwid事件实机"></a></div><figcaption>RE04 STS2 Ranwid事件实机</figcaption><p>事件场景/叙事/动作与后果分层</p><small>1920 x 1080 | reused | PC Gamer实机文章的Mega Crit版权截图；右上v0.98.0与2026-03-05；非独立事件角色透明源</small><p>左侧老者与暗树，右侧完整标题/三段叙事和三条选择；黄色动作标题、白色后果同一承托，资源仍留顶部。本项目对应叙事滚动区/真实选项/局部明度承托；不是过场动效的帧或时长证据。</p><a href="https://www.pcgamer.com/games/roguelike/slay-the-spire-2-early-access-features/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/13.jpg" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" alt="RE05 方舟IS7 未涉足之树事件整页"></a></div><figcaption>RE05 方舟IS7 未涉足之树事件整页</figcaption><p>事件三选项/左侧完整叙事/持续资源与底部收藏队伍</p><small>1080 x 485 | new-cross-domain-reference | 根会话本轮取得的TapTap玩家IS7实机原提供图；图片URL日期2026-07-20，帖子修改7月19日，具体补丁未标；1080x485提供尺寸，非官方独立UI资产。跨域引用原文件，不复制。</small><p>中央树场景，左下完整事件标题/叙事；右侧探索内部、探索源头、休息三选项，各用亮动作条和暗色后果区；顶部持续资源、底部收藏/零件/队伍。对应本项目事件动作/真实后果分区及导航层级；不能从静图推发生概率或动画。图内上方甜美的伤口是主题/路线标题，未涉足之树才是事件。</p><a href="https://www.taptap.cn/moment/828059228320039824" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/01.jpg" target="_blank">原图</a></figure></div></section><section id="battle"><h2>战斗主界面与附加界面</h2><div class="grid"><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/14.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/14.png" alt="STS2目标选择与完整操作台"></a></div><figcaption>STS2目标选择与完整操作台</figcaption><p>能量 / 手牌 / 结束回合 / 目标选择</p><small>1920 x 1080 | new | 截图馆实际游戏状态截图；下载其Download原字节，未resize/裁切/重绘；2026-10-11获取，v0.98.2，画内2026-03-15，不声称最新版；逐张view_image观察</small><p>左下绿能量3/3、底部五张扇形卡、右下独立End Turn，红箭头与黄色四角共同指向右敌人，血条贴敌脚。HUD占边缘，场景中央保留动作空间；能量/意图以平面剪影和数值辨识。截图没有本项目职业技能按钮。</p><a href="https://interfaceingame.com/screenshots/slaythespire2_38/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/14.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/15.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/15.png" alt="STS2当前牌库与词条提示"></a></div><figcaption>STS2当前牌库与词条提示</figcaption><p>牌库 / 消耗牌展示</p><small>1920 x 1080 | new | 截图馆实际游戏状态截图；下载其Download原字节，未resize/裁切/重绘；2026-10-11获取，v0.98.2，画内2026-03-14，不声称最新版；逐张view_image观察</small><p>当前牌组五列完整卡面，画面边缘截断下一行说明滚动延续；右长滚动条、左返回、左下View Upgrades分属不同职责。悬起Defend与邻近Block说明区建立局部细节层。未出现消耗牌标题，不能当消耗牌实际状态。</p><a href="https://interfaceingame.com/screenshots/slay-the-spire-2-cards/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/15.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/16.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/16.png" alt="STS2卡牌图鉴筛选"></a></div><figcaption>STS2卡牌图鉴筛选</figcaption><p>编组 / 长卡列表筛选</p><small>1920 x 1080 | new | 截图馆实际游戏状态截图；下载其Download原字节，未resize/裁切/重绘；2026-10-11获取，v0.98.2，画内2026-03-14，不声称最新版；逐张view_image观察</small><p>左固定侧栏含Search、职业图标、Card Type、Rarity、Cost、A-Z；右五列卡组与长滚动条。卡牌标题/费用/类型/正文在框内统一，未知卡保留同形占位；该图是图鉴，未显示选中计数与编组确认，不能当编组实图。</p><a href="https://interfaceingame.com/screenshots/slaythespire2_29/" target="_blank">来源</a> / <a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/16.png" target="_blank">原图</a></figure><figure><div class="picture"><a href="../../../../.tmp/selection-map-observe-1011/game/reference-assets/17.png" target="_blank"><img loading="lazy" src="../../../../.tmp/selection-map-observe-1011/game/reference-assets/17.png" alt="STS2悬起手牌与指向"></a></div><figcaption>STS2悬起手牌与指向</figcaption><p>手牌抬起 / 目标选择 / 能量</p><small>1920 x 1080 | new | 截图馆实际游戏状态截图；下载其Download原字节，未resize/裁切/重绘；2026-10-11获取，v0.98.2，画内2026-03-15，不声称最新版；逐张view_image观察</small><p>中间Strike抬起变大并显示正文，红折节箭头从卡上通向右敌人；余卡仍留底部，两侧能量2/3及End Turn各独立。画面将卡焦点/目标四角/箭头分三种形态，图本身不证明输入方式或移动时序。</p><a href="https://interfaceinga
