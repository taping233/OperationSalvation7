<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><title>卡牌比例位置检查</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/card-v3.css"><link rel="stylesheet" href="css/card-layout-selected.css">
<style>html,body{margin:0;background:#30363e;color:#fff;overflow:auto;font-family:Arial}#viewport{position:relative;inset:auto;width:auto;height:auto;display:block;overflow:visible;padding:18px}header{display:flex;gap:18px;align-items:center;margin-bottom:18px}button,select{padding:8px}.audit-grid{display:grid;grid-template-columns:repeat(9,145px);gap:18px}.audit-item{min-width:0}.audit-item .hs-card{width:145px!important;font-size:10px;margin:0!important}.audit-label{font-size:12px;margin:9px 0 17px}.audit-item img{max-width:none}.raw{width:145px;height:106px;object-fit:contain;background:#171d24;margin-top:8px}</style></head><body><div id="viewport"><header><b>共享卡面样式与原图对照</b><button id="prev">上一组</button><span id="status"></span><button id="next">下一组</button><select id="mode"><option value="moves">武术与法术</option><option value="other">其他卡牌</option></select></header><main class="audit-grid" id="grid"></main></div>
<script type="module">
import SDT from '/src/core/sdt-facade.js';
import '/src/core/icons-bitmap.js';
import '/src/core/art.js';
import '/src/cards/cards.js';
const all=SDT.Cards.all();let page=0;
function render(){const moves=document.querySelector('#mode').value==='moves';const cards=all.filter(c=>moves?['武术','法术'].includes(c.type):!['武术','法术'].includes(c.type));cards.sort((a,b)=>(a.id==='tt7-goldencicada'?-1:b.id==='tt7-goldencicada'?1:0));const batch=cards.slice(page*18,page*18+18);document.querySelector('#grid').innerHTML=batch.map(c=>`<section class="audit-item">${SDT.Cards.cardHTML(c,'sm')}<div class="audit-label">${c.name} · ${c.id}</div></section>`).join('');document.querySelectorAll('.audit-item').forEach(item=>{const img=item.querySelector('.hsc-art img');if(img){const raw=img.cloneNode();raw.className='raw';raw.removeAttribute('style');raw.removeAttribute('data-asset-key');item.append(raw);}});document.querySelector('#status').textContent=`${page+1}/${Math.ceil(cards.length/18)} · ${cards.length}张`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*18>=cards.length;}
document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#mode').onchange=()=>{page=0;render()};render();
</script></body></html>
