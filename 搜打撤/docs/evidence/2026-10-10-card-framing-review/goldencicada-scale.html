<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><title>金蝉脱壳缩放对照</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/card-v3.css"><link rel="stylesheet" href="css/card-layout-selected.css"><style>html,body{margin:0;background:#30363e;color:#fff;overflow:auto;font-family:Arial}#viewport{position:relative;inset:auto;width:auto;height:auto;display:block;overflow:visible;padding:24px}h1{font-size:24px}.compare{display:flex;gap:38px}.col{width:290px}.hs-card{width:272px!important;font-size:18px;margin:14px 0!important}.mini .hs-card{width:145px!important;font-size:10px}.mini{margin-top:24px}.note{height:44px;font-size:14px;line-height:1.5}.raw{width:290px}.fit .hsc-art{background:#1e2130!important}.fit .hsc-art img{object-fit:contain!important;object-position:50% 8%!important}.wide .hsc-art{background:#1e2130!important}.wide .hsc-art img{position:absolute;left:-15%!important;top:0!important;width:130%!important;height:auto!important;object-fit:contain!important;object-position:center!important}.shift .hsc-art img{object-position:20% 50%!important}</style></head><body><div id="viewport"><h1>金蝉脱壳：现状 / 移位 / 缩放</h1><p>实际卡牌渲染与共享样式；对照原裁切与缩放方案；折中缩放已接入正式游戏。</p><main class="compare" id="compare"></main></div><script type="module">import SDT from '/src/core/sdt-facade.js';import '/src/core/icons-bitmap.js';import '/src/core/art.js';import '/src/cards/cards.js';const card=SDT.Cards.all().find(c=>c.id==='tt7-goldencicada');const variants=[['current','原裁切','满幅裁切，人物靠左且被切掉。'],['shift','只移位','横向位置20%，人物完整，但草替身被裁。'],['fit','整图缩放','按卡宽完整放入，靠上8%，两个主体都保留。'],['wide','折中缩放','原图宽为卡宽130%，靠上；人物更大，保留大部分草替身。']];document.querySelector('#compare').innerHTML=variants.map(([cls,name,note])=>`<section class="col ${cls}"><h2>${name}</h2><p class="note">${note}</p>${SDT.Cards.cardHTML(card,'lg')}<div class="mini">${SDT.Cards.cardHTML(card,'sm')}</div></section>`).join('');document.querySelectorAll('.fit .hsc-art img').forEach(img=>{img.style.setProperty('object-fit','contain','important');img.style.setProperty('object-position','50% 8%','important')});document.querySelectorAll('.wide .hsc-art img').forEach(img=>{img.style.setProperty('width','130%','important');img.style.setProperty('height','auto','important');img.style.setProperty('left','-15%','important');img.style.setProperty('top','0','important');img.style.setProperty('object-fit','contain','important')});document.querySelectorAll('.fit .hsc-art,.wide .hsc-art').forEach(el=>{el.style.setProperty('background','#1e2130','important');el.style.setProperty('overflow','hidden','important')});document.querySelectorAll('.current .hsc-art img,.shift .hsc-art img').forEach(img=>{img.style.setProperty('width','100%','important');img.style.setProperty('height','100%','important');img.style.setProperty('position','static','important');img.style.setProperty('left','0','important');img.style.setProperty('top','0','important');img.style.setProperty('object-fit','cover','important');img.style.setProperty('object-position',img.closest('.shift')?'20% 50%':'50% 28%','important')});</script></body></html>
