<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代号柒 · 正式流程参考板</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#14171a;color:#eceeec}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{padding:30px 38px 22px;border-bottom:1px solid #ffffff20}header small{color:#abd8d2;letter-spacing:.16em}h1{font-size:30px;margin:12px 0}header p{color:#acb6bb;max-width:920px;line-height:1.7;margin:0}nav{display:flex;gap:8px;padding:16px 38px;position:sticky;top:0;background:#14171aee;z-index:2;border-bottom:1px solid #ffffff18}nav button{padding:10px 22px;color:#bdc5c7;background:transparent;border:1px solid #5e686e}nav button[aria-pressed=true]{color:#111c1c;background:#b9ded8;border-color:#b9ded8}.contract{padding:0 38px 22px;display:flex;gap:32px;align-items:baseline}.contract h2{font-size:24px;min-width:110px}.contract p{font-size:16px;line-height:1.7;max-width:950px;color:#d4dada}main{padding:0 38px 48px;display:grid;gap:28px}.reference{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);border:1px solid #485058;background:#1b2024}.image{display:flex;align-items:center;background:#101315;position:relative;border:0;padding:0;width:100%;min-height:240px}.image img{display:block;width:100%;height:auto;max-height:570px;object-fit:contain}.image span{position:absolute;bottom:12px;right:12px;padding:7px 12px;background:#12181dda;color:#d7e7e3;font-size:12px}.copy{padding:24px 28px}.copy small{font-size:12px;color:#a5c5c1}.copy h3{font-size:22px;line-height:1.45;margin:10px 0 18px}.copy h4{margin:20px 0 8px;font-size:14px;color:#eadca9}.copy ul{padding-left:20px;line-height:1.75;font-size:14px;color:#c5ced0}.copy li+li{margin-top:7px}.copy a{color:#b5ddd7;display:inline-block;margin-top:14px;font-size:13px}.current{padding:20px;border:1px dashed #596268;background:#171c20}.current summary{cursor:pointer;font-weight:600}.current img{width:100%;max-height:640px;object-fit:contain;margin-top:20px}.notice{font-size:13px;color:#949fa6;line-height:1.7}.empty{padding:32px;border:1px dashed #596268;color:#b3bfc3}dialog{width:min(95vw,1700px);max-height:94vh;padding:0;border:1px solid #73848b;background:#101417}dialog::backdrop{background:#000d}dialog img{display:block;max-width:100%;max-height:87vh;margin:auto;object-fit:contain}dialog button{position:absolute;top:12px;right:12px;width:40px;height:40px;color:#fff;background:#17242dee;border:1px solid #789098;font-size:23px}footer{padding:20px 38px;color:#849398;font-size:12px;border-top:1px solid #fff2}@media(max-width:850px){.reference{grid-template-columns:1fr}nav{overflow:auto;padding:12px 20px}main{padding:0 20px 30px}.contract{padding:0 20px;display:block}header{padding:24px 20px}}
</style></head><body>
<header><small>CODE NAME 7 / VISUAL REFERENCE</small><h1>正式流程 · 实机参考板</h1><p>以明日方舟肉鸽、杀戮尖塔、崩坏：星穹铁道和绝区零的实机画面作为结构基准。逐页对照构图、信息位置、状态反馈与主操作；把本作的角色、卡牌和玩法填入对应位置。</p></header>
<nav aria-label="参考分类"></nav><section class="contract"><h2></h2><p></p></section><main></main><footer>参考图仅用于设计对照。动效实证与拟采用参数分别记录；图片无法证明帧级时序。</footer>
<dialog aria-label="参考原图"><button aria-label="关闭原图">×</button><img alt="参考原图"></dialog>
<script type="module">
const sections={roster:['人物选择','参考星穹铁道的固定人物展示和等大候选头像；本作五人和三套场景皮肤统一主图容器。'],preparation:['出征整备','参考绝区零训练配置的候选容器、已配置槽位和固定确认区；本作保留仓库与携带分区。'],map:['地图','采用方舟的图标＋短标签节点、细有向连线、清晰的当前路线与低对比远端状态。节点点击先选中，地点详情与进入动作有明确层级。'],event:['事件','采用方舟左侧大场景和叙事、右侧等宽选项的构图；动作、成本与结果靠近摆放，确认处于稳定位置。'],reward:['奖励','采用方舟独立奖励单元与领取动作、单独继续出口；少量候选借鉴尖塔的集中展示。逐项领取和任选一张分别表现。'],shop:['商店','采用方舟角色区＋货架，以及尖塔商品与价格直接成组的陈列。点击查看大卡，购买、服务和离开分别安排。'],battle:['战斗与大卡','采用尖塔的中央战场、左右固定行动、前景聚焦大卡。按老板要求点击手牌放大阅读，显式选择使用后再确定目标。'],motion:['动效与过渡','已核实的截图只证明布局。进入、选中、详情、返回与结算依照同一状态链实现；视频尚未核实的具体时长标为适配参数。']};
const current={map:'03-map-before.jpg',event:'01-entry.jpg',reward:'05-natural-victory.jpg',battle:'04-battle-entry.jpg'};
const sources=(await Promise.all(['reference-board-sources.json','sts-reference-sources.json','roster-preparation-sources.json'].map(path=>fetch(path).then(r=>{if(!r.ok)throw Error(path);return r.json()})))).flat();
const el=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n};
const nav=document.querySelector('nav'),main=document.querySelector('main'),dialog=document.querySelector('dialog');
for(const [key,[label]] of Object.entries(sections)){const b=el('button',label);b.dataset.section=key;b.onclick=()=>render(key);nav.append(b)}
function render(key){document.querySelector('.contract h2').textContent=sections[key][0];document.querySelector('.contract p').textContent=sections[key][1];nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.section===key)));main.replaceChildren();
const chosen=sources.filter(s=>s.section===key);
for(const source of chosen){const article=el('article');article.className='reference';const button=el('button');button.className='image';button.setAttribute('aria-label','放大 '+source.title);const img=el('img');img.src=source.localFile||source.imageUrl;img.alt=source.title;img.loading='lazy';button.append(img,el('span','点击查看原图'));button.onclick=()=>{dialog.querySelector('img').src=img.src;dialog.querySelector('img').alt=source.title;dialog.showModal()};const copy=el('div');copy.className='copy';copy.append(el('small',source.game),el('h3',source.title));for(const [title,items] of [['原作可见结构',source.observations],['本作复刻对应',source.adaptation]]){copy.append(el('h4',title));const list=el('ul');items.filter(t=>!t.startsWith('已在')&&!t.startsWith('主代理')).forEach(t=>list.append(el('li',t)));copy.append(list)}const link=el('a','查看图源与上下文 ↗');link.href=source.sourcePage;link.target='_blank';link.rel='noreferrer';copy.append(link);article.append(button,copy);main.append(article)}
if(!chosen.length){const p=el('div','动态来源正在核实。已确定的交互：点击反馈 → 准备目的页 → 展开信息区；返回时取消旧页动作和迟到回调。');p.className='empty';main.append(p)}
if(current[key]){const details=el('details');details.className='current';details.append(el('summary','对照：本作本轮初始画面（整改基线）'));const image=el('img');image.src=current[key];image.alt='代号柒整改前对照';details.append(image);main.append(details)}
history.replaceState(null,'','#'+key)}
dialog.querySelector('button').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render(sections[location.hash.slice(1)]?location.hash.slice(1):'map');
</script></body></html>
