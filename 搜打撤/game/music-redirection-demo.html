<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四首草稿 · 重写与数值检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#e7edf3;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:36px 24px}small{color:#90becb;letter-spacing:.14em}h1{font-size:32px;line-height:1.3}p{color:#adbfc9}section{padding:22px;border:1px solid #456171;border-radius:14px;margin:18px 0;background:#ffffff05}h2{margin:6px 0;font-size:23px}audio{width:100%;margin-top:12px}a{color:#aed9e7}.numbers{font-size:14px;background:#ffffff06;padding:9px 12px;border-radius:7px}.status{min-height:25px}footer{font-size:13px;color:#95a9b5;margin-top:28px}a:focus-visible{outline:2px solid #aed9e7;outline-offset:3px}</style>
<main><small>代号柒 / 方向重写</small><h1>三首重写，商店保留上一版</h1><p>各 30 秒草稿。数值检查用于发现制作问题，好听与风格仍由试听判断。</p><div id="tracks"></div><p><a href="./music-refinement-demo.html">上一轮对照</a></p><footer>钢琴采样：Salamander Grand Piano V3 — Alexander Holm，<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>；本曲使用部分音高／力度采样，自定义离线播放。<br>编曲方法参考 <a href="https://makingmusic.ableton.com/arranging-as-a-subtractive-process" target="_blank" rel="noopener">Ableton · 减法编曲</a>；测量方法参考 <a href="https://www.izotope.com/community/blog/what-are-lufs" target="_blank" rel="noopener">iZotope · LUFS 与真峰值</a>。</footer></main>
<script type="module">
import title from '../docs/evidence/2026-10-09-WF-music-redirection/title-rewrite-30s.mp3?url';
import explore from '../docs/evidence/2026-10-09-WF-music-redirection/explore-rewrite-30s.mp3?url';
import battle from '../docs/evidence/2026-10-09-WF-music-redirection/battle-rewrite-30s.mp3?url';
import shop from '../docs/evidence/2026-10-09-WF-shop-remake/shop-lamplight-deal-30s.mp3?url';
import evaluation from '../docs/evidence/2026-10-09-WF-music-redirection/evaluation.json';
const rows=[['title','首页','霜窗回声 · 钢琴重写','真实钢琴采样、双手分工与踏板释放；保留原主题的音高倾向，重新写乐句。',title],['explore','探索','灰线行军 · 全新行旅','清音吉他、电钢、缓慢铺底与轻节奏；去掉上一轮的钢琴／木管轮换。',explore],['battle','战斗','黑脉交锋 · 现代战斗','鼓、贝斯、电吉他与键盘；参考 Last Surprise 的切分与留白方法，旋律重新创作。',battle],['shop','商店','灯下交易 · 上一版保留','保留你更认可的商店重做初稿，音频原样使用。',shop]];const players=[];
for(const [id,scene,name,desc,url] of rows){const result=evaluation.checks.find(r=>r.role===id),m=result.final;const card=document.createElement('section');card.innerHTML=`<small>${scene} · 30 秒草稿</small><h2>${name}</h2><p>${desc}</p><audio controls preload="metadata" aria-label="${scene}试听" src="${url}"></audio><p class="status" aria-live="polite">点击播放试听</p><p class="numbers">${m.input_i.toFixed(1)} LUFS · 真峰值 ${m.input_tp.toFixed(1)} dBTP · LRA ${m.input_lra.toFixed(1)} LU · ${result.production_checks_passed?'设定的制作检查通过':'存在待处理项'}</p><a href="${url}" download>下载 MP3</a>`;document.getElementById('tracks').append(card);const a=card.querySelector('audio'),s=card.querySelector('.status');players.push(a);a.addEventListener('play',()=>players.forEach(p=>{if(p!==a)p.pause()}));a.addEventListener('playing',()=>s.textContent='正在试听 · '+name);a.addEventListener('pause',()=>s.textContent=a.ended?'试听结束':'已暂停');a.addEventListener('ended',()=>s.textContent='试听结束');a.addEventListener('error',()=>s.textContent='加载失败')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)players.forEach(p=>p.pause())});
</script></html>
