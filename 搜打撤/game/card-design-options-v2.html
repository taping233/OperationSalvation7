<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一款卡牌 · 稀有度设计预览</title>
<link rel="stylesheet" href="css/card-rarity-preview.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#1c2024;color:#e7ecee;font:14px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1460px;padding:28px 38px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #465059}h1{margin:0 0 7px;font-size:27px;font-weight:600}p{margin:0;color:#aeb7bd}a{color:#bad3de;text-underline-offset:4px}button{font:inherit;cursor:pointer}.controls{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:18px}.buttons{display:flex;gap:5px}.buttons button{border:1px solid #48535b;padding:7px 14px;background:none;color:#cbd3d7}.buttons button[aria-pressed=true]{background:#dce4e8;color:#222a30}.status{font-size:12px;margin-top:12px;color:#b7c3cc}.tier-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-top:22px}.tier-grid.single{grid-template-columns:1fr;max-width:550px;margin-left:auto;margin-right:auto}.tier h2{font-size:17px;margin:0 0 4px;font-weight:600;color:var(--shine)}.tier .craft-note{font-size:12px;color:#aeb7bd;min-height:38px}.stage{display:flex;align-items:center;justify-content:center;height:calc(448px * var(--scale,1));margin-top:9px;background:radial-gradient(ellipse,#374049,#232a30 74%)}.open-card{border:0;background:none;padding:0;text-align:left;width:calc(272px * var(--scale,1));height:calc(406px * var(--scale,1))}.open-card .craft-card{transform:scale(var(--scale,1));transform-origin:top left}.caption{margin-top:12px;font-size:12px;color:#aeb7bd}.footer{margin-top:23px;padding-top:17px;border-top:1px solid #44505a;font-size:12px;color:#a6b1b8}button:focus-visible{outline:2px solid #dfeaf0;outline-offset:5px}dialog{border:1px solid #556571;border-radius:8px;background:#20272e;color:#e4ecef;padding:22px 34px;max-width:94vw;max-height:95vh}dialog::backdrop{background:#0b1016d9}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:25px;font-size:15px}.dialog-top button{font-size:24px;border:0;background:none;color:#e4ecef;padding:0 4px}#large{padding:10px 10px 5px}dialog .note{margin-top:17px;font-size:12px;color:#a6b1b8}
</style>
<main>
<header class="page-head"><div><h1>第一款卡牌 · 稀有度设计预览</h1><p>全幅原画、左上费用、居中卡名。文字继续下移，稀有度借鉴成熟卡牌的宝石与饰面机制。</p></div><a href="card-design-references/">真实卡牌参考 ↗</a></header>
<div class="controls"><nav class="buttons" aria-label="卡牌样本"><button data-card="2" aria-pressed="true">青龙化身</button><button data-card="1" aria-pressed="false">恶魔之力</button><button data-card="0" aria-pressed="false">箭雨</button></nav><nav class="buttons" aria-label="查看方式"><button data-mode="compare" aria-pressed="true">同图看五档</button><button data-mode="actual" aria-pressed="false">只看实际稀有度</button></nav></div>
<p class="status" id="status"></p><div class="tier-grid" id="grid"></div>
<aside class="source-notes" style="margin-top:22px;padding:18px 20px;border:1px solid #44505a;background:#242c33"><b>借鉴依据</b><div style="display:flex;align-items:center;gap:22px;margin-top:14px"><a href="card-design-references/" style="display:block;max-width:480px"><img src="card-design-references/images/snap.png" alt="SNAP官方展示：彩色边框和亮面名称" style="display:block;width:100%;max-height:200px;object-fit:contain"></a><a href="card-design-references/" style="display:block"><img src="card-design-references/images/hearth-unit.png" alt="炉石官方卡牌：固定位置的稀有度宝石" style="display:block;height:200px;width:auto"></a></div><p style="margin-top:8px">炉石：固定位置的椭圆宝石识别品质。SNAP：升级通过边框、亮面名称、Foil与Prism饰面体现外观差异。</p><p style="margin-top:8px;font-size:12px"><a href="https://hearthstone.blizzard.com/en-us/news/10245930/hearthstone-crafting-in-dust-we-trust" target="_blank" rel="noreferrer">炉石官方宝石说明 ↗</a> · <a href="https://marvelsnap.helpshift.com/hc/en/3-marvel-snap/faq/34-what-does-upgrading-a-card-do/" target="_blank" rel="noreferrer">SNAP官方升级视觉说明 ↗</a> · <a href="https://marvelsnap.com/fntyspltlglpg/" target="_blank" rel="noreferrer">SNAP官方饰面说明 ↗</a></p><p style="margin-top:9px;font-size:12px">这里借鉴视觉机制；五档颜色沿用代号柒稀有度，并不将两款游戏的升级规则搬入本项目。</p></aside><p class="footer">仅审阅预览，未接入正式游戏。左上费用与第一款同形，卡名居中；卡面不显示额外攻击、伤害类型和价值。点击卡牌可单独放大。</p>
</main>
<dialog id="detail"><div class="dialog-top"><b id="detailTitle"></b><button aria-label="关闭卡牌预览">×</button></div><div id="large"></div><p class="note">审阅色样 · 按 Esc 收回</p></dialog>
<script type="module">
import { rarityOf } from './src/cards/card-rarity.js';
const cards=[{name:'箭雨',rarity:'古朴',cost:1,desc:'攻（-1），目标为敌方全体。',art:'martial-tt3-arrow-rain'},{name:'恶魔之力',rarity:'职业',cost:1,desc:'7′，损失 2 点生命。',art:'spell-cc-demon'},{name:'青龙化身',rarity:'稀有',hero:true,cost:2,desc:'真龙降世：本局对战中，将‘初始攻击’化为‘青龙偃月斩’。',art:'hero-warrior'}];
const tiers={
古朴:{class:'common',tone:'#929b9f',shine:'#e3e9eb',note:'素面边框 · 白色宝石',caption:'固定宝石识别；普通卡保持素面。'},
稀有:{class:'rare',tone:'#509ccb',shine:'#c0e7ff',note:'蓝色亮边 · 蓝色宝石',caption:'借鉴彩色边框，以边沿明暗形成层次。'},
史诗:{class:'epic',tone:'#9e72ce',shine:'#e3caff',note:'紫色亮边 · 缓慢边沿反光',caption:'采用更明显的饰面与边框反光，不加额外形状。'},
传说:{class:'legendary',tone:'#d0a13d',shine:'#ffe6a3',note:'金属边框 · 亮面名称',caption:'借鉴SNAP亮面名称与金属饰面。'},
棱彩:{class:'prism',tone:'#c2b5eb',shine:'#f9e4f3',note:'全息边框 · 镭射饰面',caption:'借鉴SNAP的Foil/Prism饰面，保留原画主体。'},
职业:{class:'common',tone:'#364451',shine:'#c4d0d9',note:'独立职业标记',caption:'职业不是品质晋级，保持独立标识。'},
衍生:{class:'common',tone:'#6c9c9f',shine:'#b4dad5',note:'独立衍生标记',caption:'衍生来源遵循项目现行稀有度判定。'},
初始:{class:'common',tone:'#7d8991',shine:'#c7d0d5',note:'基础素面',caption:'基础卡保持简单。'}};
let chosen=2,mode='compare',design='one';
function styleOf(r){const t=tiers[r];return `--tone:${t.tone};--shine:${t.shine};--rim:${r==='棱彩'?'linear-gradient(135deg,#f6c7e9,#f6df9d,#a3ecda,#adc9f8,#c9b6ef)':`linear-gradient(135deg,${t.shine},${t.tone} 25%,#202e39 52%,${t.tone} 75%,${t.shine})`}`;}
function jewel(r){const t=tiers[r];if(['初始','职业','衍生'].includes(r))return `<span aria-hidden="true">${r==='职业'?'⬟':r==='衍生'?'△':'○'}</span>`;const colors=r==='棱彩'?['#f6c7e9','#fff0be','#b0e6d8','#b3caf5','#c4aceb']:[t.shine,t.tone,'#293549',t.shine,t.tone];return `<svg class="gem" viewBox="0 0 18 24" aria-hidden="true"><path d="M9 1 15 5 17 12 15 19 9 23 3 19 1 12 3 5Z" fill="${colors[1]}" stroke="${colors[0]}"/><path d="M9 2 5 7l4 5 4-5Z" fill="${colors[0]}"/><path d="m1 12 4-5 4 5-4 5Z" fill="${colors[2]}"/><path d="m17 12-4-5-4 5 4 5Z" fill="${colors[3]}"/><path d="m5 17 4-5 4 5-4 5Z" fill="${colors[4]}"/></svg>`;}
function cardHTML(r){const c=cards[chosen],t=tiers[r];return `<div class="craft-card ${t.class} design-one" data-rarity="${r}" style="${styleOf(r)}"><div class="picture"><img src="assets/cards/${c.art}.webp" alt="${c.name}原画"></div><span class="cost" aria-label="费用${c.cost}">${c.cost}</span><div class="rarity-band">${jewel(r)}<span>${r}</span></div><div class="first-copy"><span class="name">${c.name}</span><div class="rules">${c.desc}</div></div>${['史诗','传说','棱彩'].includes(r)?'<i class="edge-sheen" aria-hidden="true"></i>':''}</div>`;}
function setScale(){const grid=document.querySelector('#grid'),count=mode==='compare'?5:1;const scale=Math.min(1,(grid.clientWidth-(count-1)*18)/count/304);grid.style.setProperty('--scale',scale);}
function render(){const c=cards[chosen],actual=rarityOf(c,()=>undefined),list=mode==='compare'?['古朴','稀有','史诗','传说','棱彩']:[actual];const grid=document.querySelector('#grid');grid.classList.toggle('single',mode==='actual');grid.innerHTML=list.map(r=>`<section class="tier" style="${styleOf(r)}"><h2>${r}</h2><p class="craft-note">${tiers[r].note}</p><div class="stage"><button class="open-card" data-open="${r}" aria-label="放大${r}工艺">${cardHTML(r)}</button></div><p class="caption">${tiers[r].caption}</p></section>`).join('');document.querySelector('#status').textContent=mode==='compare'?`同一张原画演示五种工艺，仅供比较；${c.name}的实际稀有度为「${actual}」。`:`${c.name} · 实际稀有度「${actual}」。`;document.querySelectorAll('[data-card]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.card===chosen)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===design)));setScale();}
const dialog=document.querySelector('#detail');document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{design=b.dataset.design;render();});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.card;render();});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});document.querySelector('#grid').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;document.querySelector('#detailTitle').textContent=cards[chosen].name+' / '+b.dataset.open+'工艺';document.querySelector('#large').innerHTML=cardHTML(b.dataset.open);dialog.showModal();};dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close();};window.addEventListener('resize',setScale);render();
</script>
</html>
