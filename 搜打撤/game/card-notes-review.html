<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡牌备注 · 审阅手册</title><link rel="stylesheet" href="/tools/card-notes-review/style.css"></head>
<body><header><a class="brand" href="/card-notes-review.html">柒 / FIELD NOTES</a><span>文案审阅 · 2026.10.26</span><button id="export">导出全部备注 ↗</button></header>
<main><section class="intro"><div><p class="eyebrow">升格会的冬日猜想 / 卡牌档案</p><h1>每张牌，<br>都有话要说<span>。</span></h1><p class="subtitle">装备的来历，招式的余音，还有那些不太正经的使用建议。</p><p class="hint">保留老板原文，补齐其余备注。新增引语与来历均为创作草稿，等待审阅。<br>此页修改独立保存在当前浏览器，导出后可同步回游戏。</p></div><aside><div class="big-number">291<span> / 张卡牌</span></div><div class="stats"><p><b>32</b> 条老板原文</p><p><b>259</b> 条新增草稿</p></div><p id="progress">正在载入…</p></aside></section>
<section class="toolbar" aria-label="筛选备注"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索卡名、备注或牌效" aria-label="搜索卡名、备注或牌效"></label><select id="source" aria-label="备注来源"><option value="new">新增草稿</option><option value="all">全部备注</option><option value="original">老板原文</option></select><select id="status" aria-label="审阅状态"><option value="all">全部状态</option><option value="pending">待审阅</option><option value="approved">已看过</option><option value="flagged">需要修改</option><option value="edited">我改过的</option></select></section>
<nav id="types" aria-label="卡牌类型"></nav><div class="results"><p id="count" aria-live="polite"></p><span>点「编辑备注」修改 · 点「已看过」记录进度</span></div><div id="notice" role="status"></div><section id="grid" aria-label="卡牌备注列表"></section><div id="empty" hidden>没有匹配的卡牌，试试其他关键词或筛选条件。</div><div class="pagination"><button id="prev">← 上一页</button><span id="page"></span><button id="next">下一页 →</button></div></main>
<footer>FIELD NOTES / 01 <span>文字会留下，冒险继续。</span></footer>
<dialog id="editor"><form id="form"><p class="eyebrow">编辑备注</p><h2 id="edit-name"></h2><p id="edit-effect"></p><label for="note">卡牌备注 <small>最多 60 字</small></label><textarea id="note" maxlength="60" required rows="4"></textarea><p id="edit-message" role="status"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存修改</button></div></form></dialog>
<script type="module" src="/tools/card-notes-review/app.js"></script></body></html>
