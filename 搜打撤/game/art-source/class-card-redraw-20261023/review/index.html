<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业卡 · 逐张审阅</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">柒</span><div><strong>职业卡 · 逐张审阅</strong><small>NAI5 草稿 × 内置修订</small></div></div><div class="top-actions"><span id="progressText">正在载入</span><button id="export" class="button">导出全部反馈 ↗</button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="nav-head"><span>本轮候选</span><b>16</b></div><label class="filter"><span class="sr-only">筛选卡牌</span><select id="filter"><option value="all">全部卡牌</option><option value="pending">尚未评价</option><option value="noted">已有反馈</option><option value="redesign">需要重做</option></select></label><nav id="cardList" aria-label="选择卡牌"></nav><div class="nav-foot"><span class="progress-track"><i id="progressBar"></i></span><p>逐张填写，也可以随时回来继续。</p></div></aside>
<main class="main"><div class="card-heading"><div><p id="eyebrow" class="eyebrow">人物 / 职业</p><h1 id="cardTitle">载入卡牌…</h1><p id="shot" class="shot"></p></div><span id="position" class="position"></span></div><div class="compare-head"><div><span class="dot draft"></span> NAI5 草稿 <small>构图起稿</small></div><div><span class="dot paint"></span> <span id="paintLabel">内置修订</span></div></div><section class="comparison" aria-label="卡牌图片对比"><button class="art-stage" id="draftZoom" aria-label="放大NAI5草稿"><img id="draftImage" alt=""><span class="zoom-hint">⤢ 放大查看</span></button><button class="art-stage" id="paintZoom" aria-label="放大内置修订"><img id="paintImage" alt=""><span class="zoom-hint">⤢ 放大查看</span></button></section><div class="view-note"><span id="revisionNote">原反馈保留，可继续补充。</span><button id="previousVersion" class="text-button">查看上一版</button></div><div class="bottom-nav"><button id="previous" class="button">← 上一张</button><span>反馈自动保存，可随时切换卡牌</span><button id="next" class="button primary">下一张 →</button></div></main>
<aside class="feedback"><div class="feedback-title"><span class="eyebrow">YOUR NOTES</span><h2>这张怎么改？</h2><p>写下保留的部分，以及希望调整的位置。</p></div><fieldset><legend>处理意见</legend><div id="verdicts" class="verdicts"><button data-verdict="pending">还没想好</button><button data-verdict="keep">可以保留</button><button data-verdict="adjust">局部调整</button><button data-verdict="redesign">重新设计</button></div></fieldset><label class="field-label" for="preference">更倾向哪个版本？</label><select id="preference"><option value="">暂不选择</option><option value="nai">NAI5 草稿</option><option value="repaint">内置重绘</option><option value="combine">结合两者</option><option value="neither">两个都需要改</option></select><fieldset class="tags-field"><legend>主要看哪些地方？<small>可多选</small></legend><div id="tags" class="tags"></div></fieldset><label class="field-label" for="notes">具体建议</label><textarea id="notes" placeholder="例如：保留左图的动作和机位，用右图的脸；前景刀刃缩小一些，背景再简洁一点。" maxlength="20000"></textarea><div class="save-state" id="saveState" role="status" aria-live="polite">尚无反馈</div><button id="copyCurrent" class="text-button">复制这张的反馈</button><p class="storage-note">反馈保存在本机项目中。这里只记录意见，不会替换游戏卡图。</p></aside>
</div>
<dialog id="lightbox"><div class="lightbox-bar"><strong id="lightboxTitle"></strong><button id="closeZoom" class="button">关闭 ✕</button></div><img id="largeImage" alt=""></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
