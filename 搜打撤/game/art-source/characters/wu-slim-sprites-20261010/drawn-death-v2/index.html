<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无 · 逐帧绘画死亡</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151b25;color:#ecf0f7;font:15px system-ui}main{max-width:850px;margin:auto;padding:22px}h1{font-size:24px;margin:0 0 8px}p{color:#b8c5d6;line-height:1.6}nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{padding:8px 13px;border:1px solid #526981;background:#253247;color:inherit;border-radius:7px;cursor:pointer}label{display:flex;align-items:center;gap:7px}.stage{max-width:680px;margin:14px auto;aspect-ratio:1;background:repeating-conic-gradient(#243040 0% 25%,#2b394b 0% 50%) 50%/28px 28px;border:1px solid #4a5870;border-radius:10px}canvas{display:block;width:100%;height:100%}output{display:block;color:#bad5f6;margin-top:10px}a{color:#9ac8ff}</style>
<main><h1>无 · 逐帧绘画死亡</h1><p>整个人物重新绘画：失衡、跪撑、侧倒、躺倒。播完停在倒地帧。</p><nav><button id="play" disabled>播放一次</button><button id="idle" disabled>站立帧</button><button id="loop" disabled>循环演示</button><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><button id="next" disabled>下一帧</button></nav><label style="margin-top:12px">关键帧<input id="seek" type="range" min="0" max="4" value="0" aria-label="死亡关键帧" style="flex:1"></label><div class="stage"><canvas id="stage" width="1024" height="1024" aria-label="无逐帧死亡动画"></canvas></div><output id="status">正在载入绘画帧</output><p>独立绘画候选，未接入游戏。<a href="README.md">制作说明</a></p></main><script type="module" src="preview.js"></script></html>
