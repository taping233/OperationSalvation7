<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>无 · 部件拼装与动作检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20242b;color:#e9edf4;font:14px system-ui,"Microsoft YaHei",sans-serif}header{padding:12px 20px;border-bottom:1px solid #424954;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select{font:inherit;color:inherit;background:#353d49;border:1px solid #657185;border-radius:6px;padding:7px 11px;cursor:pointer}button.active{background:#315995;border-color:#8db9fa}label{display:flex;gap:7px;align-items:center}main{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;padding:14px}canvas{width:100%;max-height:calc(100vh - 115px);object-fit:contain;background:#dddfe3;border-radius:10px}aside{background:#2b313b;padding:14px;border-radius:10px;overflow:auto;max-height:calc(100vh - 115px)}aside h2{font-size:15px;margin:0 0 12px}aside p{line-height:1.6;color:#c0cad9}#part-list{display:grid;gap:5px}#part-list label{font-size:12px}#status{font-size:12px;color:#b9d4ff}.tools{display:flex;gap:7px;flex-wrap:wrap}input[type=range]{width:120px}input{accent-color:#7eaef4}
</style>
<header><h1>无 · 拼装与动作检查</h1><div class="tools"><button data-mode="static" class="active">静止</button><button data-mode="idle">待机</button><button data-mode="attack">挥剑</button><button data-mode="hit">受击</button></div><label><input id="pause" type="checkbox">暂停</label><label>时刻<input id="phase" type="range" min="0" max="1" step="0.01" value="0"></label><label><input id="reference" type="checkbox">叠加母版</label><label><input id="joints" type="checkbox">关节</label><button id="save">保存当前帧</button><span id="status">载入素材…</span></header>
<main><canvas id="stage" width="1536" height="1200"></canvas><aside><h2>检查选项</h2><label>背景<select id="background"><option value="light">浅灰</option><option value="dark">深灰</option><option value="checker">棋盘</option><option value="transparent">透明</option></select></label><label>放大<input id="zoom" type="range" min="1" max="1.6" step="0.1" value="1"></label><label>截图存档<textarea id="proof" aria-label="截图存档" rows="1" style="width:105px"></textarea></label><span id="proof-result"></span><p>关闭单件可检查遮挡。暂停后拖动时刻，检查起手、挥击和收势的接缝。动作切换时恢复全身视野。</p><h2>22 件部件</h2><div id="part-list"></div><p id="report"></p></aside></main><script type="module" src="./preview.js"></script></html>
