<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>无 · 死亡倒地</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141b26;color:#e7edf8;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:23px;margin:0 0 6px}p{margin:0 0 12px;color:#afbbd0}.stage{background:radial-gradient(ellipse at 50% 70%,#354255,#1b2431 65%);border:1px solid #40516a;border-radius:12px;overflow:hidden}.stage canvas{display:block;width:auto;max-width:100%;height:auto;max-height:58vh;margin:auto}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,a{background:#273750;color:#e7edf8;border:1px solid #526984;border-radius:6px;padding:6px 11px;text-decoration:none;font:inherit}button{cursor:pointer}button:disabled{opacity:.45}output{display:block;color:#adbfda}.light .stage{background:#bbc5d1}label{display:flex;gap:10px;align-items:center}input{flex:1}
</style>
<main>
<h1>无 · 死亡倒地</h1><p>失去支撑 → 屈膝撑地 → 侧身倒下。约 0.88 秒，最后保持倒地。</p>
<div class="stage"><canvas width="768" height="512" aria-label="无的死亡倒地逐帧动画"></canvas></div>
<nav><button id="once" disabled>死亡一次</button><button id="combined" disabled>待机 → 死亡</button><button id="pause" disabled>暂停</button><button id="bg">切换浅色背景</button></nav>
<nav><button id="initial" disabled>待机初始帧</button><button id="fallen" disabled>最后倒地帧</button></nav>
<label>倒地进度<input id="timeline" aria-label="倒地进度" type="range" min="0" max="20" value="0" disabled></label>
<output>正在加载帧图…</output>
<nav><a href="death-07.png" download>倒地 PNG</a><a href="sprite.json" download>动作配置</a><a href="../wu-attack-sprite-20261009/v3/index.html">攻击</a><a href="../wu-hurt-sprite-20261009/index.html">受击</a><a href="../wu-idle-sprite-20261009/v2/index.html">待机</a></nav>
</main>
<script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('output');
const buttons=Object.fromEntries(['combined','once','pause','initial','fallen','bg'].map(id=>[id,document.querySelector('#'+id)]));const timeline=document.querySelector('#timeline');buttons.bg.onclick=()=>document.body.classList.toggle('light');
try{
const death=await fetch('./sprite.json').then(r=>{if(!r.ok)throw Error('死亡配置加载失败');return r.json()});
const idleUrl=new URL(death.idleSpec,location.href);const idle=await fetch(idleUrl).then(r=>{if(!r.ok)throw Error('待机配置加载失败');return r.json()});
const deathSheet=new Image(),idleSheet=new Image();deathSheet.src=death.texture;idleSheet.src=new URL(idle.texture,idleUrl).href;await Promise.all([deathSheet.decode(),idleSheet.decode()]);
const idleSteps=idle.sequence.map((frame,i)=>({kind:'idle',frame,ms:idle.durationsMs[i],phase:'待机',step:i}));
const deathSteps=death.sequence.map((frame,i)=>({kind:'death',frame,ms:death.durationsMs[i],phase:death.phases.find(p=>i>=p.start&&i<=p.end).name,step:i}));
let schedule=deathSteps,index=0,active=!matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,last=performance.now();
function draw(){const item=schedule[index],spec=item.kind==='idle'?idle:death,sheet=item.kind==='idle'?idleSheet:deathSheet;ctx.clearRect(0,0,768,512);ctx.drawImage(sheet,(item.frame%spec.columns)*768,Math.floor(item.frame/spec.columns)*512,768,512,0,0,768,512);canvas.dataset.kind=item.kind;canvas.dataset.frame=item.frame;canvas.dataset.phase=item.phase;status.textContent=`${active?'播放中':'已暂停'} · ${item.phase} · ${item.kind==='idle'?'待机':'死亡'}第 ${item.frame+1} 帧${!active&&item.kind==='death'&&item.frame===death.lastFrame?' · 保持倒地':''}`;timeline.value=item.kind==='death'?item.step:0;buttons.pause.textContent=active?'暂停':'继续';}
function start(steps){schedule=steps;index=0;elapsed=0;active=true;last=performance.now();draw();}
function show(item){schedule=[item];index=0;elapsed=0;active=false;draw();}
function tick(now){const delta=now-last;last=now;if(active&&!document.hidden){elapsed+=delta;while(active&&elapsed>=schedule[index].ms){elapsed-=schedule[index].ms;if(index===schedule.length-1){active=false;}else index++;draw();}}requestAnimationFrame(tick);}
buttons.once.onclick=()=>start(deathSteps);buttons.combined.onclick=()=>start([...idleSteps,...deathSteps]);buttons.pause.onclick=()=>{active=!active;last=performance.now();draw();};buttons.initial.onclick=()=>show(idleSteps[0]);buttons.fallen.onclick=()=>show(deathSteps[deathSteps.length-1]);timeline.oninput=()=>show(deathSteps[Number(timeline.value)]);document.addEventListener('visibilitychange',()=>last=performance.now());for(const button of Object.values(buttons))button.disabled=false;timeline.disabled=false;draw();requestAnimationFrame(tick);
}catch(error){status.textContent=`加载失败：${error.message}`;console.error(error);}
</script></html>
