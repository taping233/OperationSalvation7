<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Plain: quiet folded paperboard with two crisp bevels and almost no metal. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4eee2"/><stop offset=".48" stop-color="#c9c1b5"/><stop offset="1" stop-color="#817b73"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset=".55" stop-color="#d9d1c5"/><stop offset="1" stop-color="#aaa196"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1d8c9"/><stop offset=".45" stop-color="#bdb4a7"/><stop offset="1" stop-color="#746e66"/></linearGradient>
    <g id="corner">
      <path d="M2 2H45V7H8V45H2Z" fill="url(#paper)" stroke="#777168" stroke-width="1.5"/>
      <path d="M7 7H39L39 11H12V39H7Z" fill="url(#fold)" stroke="#fff9ee" stroke-width="1"/>
      <path d="M13 13H33V16H16V33H13Z" fill="none" stroke="#8a8277" stroke-width="1.5"/>
      <path d="M3 3H43" fill="none" stroke="#fffaf2" stroke-width="1.5"/>
    </g>
  </defs>
  <path fill="url(#board)" fill-rule="evenodd" d="M0 0H320V320H0Z M46 46V274H274V46Z"/>
  <rect x="2" y="2" width="316" height="316" rx="3" fill="none" stroke="url(#paper)" stroke-width="4"/>
  <rect x="10" y="10" width="300" height="300" rx="2" fill="none" stroke="#eee7dc" stroke-width="2"/>
  <rect x="19" y="19" width="282" height="282" fill="none" stroke="url(#fold)" stroke-width="5"/>
  <rect x="29" y="29" width="262" height="262" fill="none" stroke="#8d857b" stroke-width="1.5"/>
  <rect x="41" y="41" width="238" height="238" fill="none" stroke="#e6ded2" stroke-width="2"/>
  <use href="#corner"/><use href="#corner" transform="translate(320) rotate(90)"/><use href="#corner" transform="translate(320 320) rotate(180)"/><use href="#corner" transform="translate(0 320) rotate(270)"/>
</svg>
