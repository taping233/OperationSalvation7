<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡牌版式 · 四版对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#222;font-family:"Microsoft YaHei","Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #3274ad;outline-offset:4px}
main{max-width:1460px;margin:auto;padding:32px 38px 24px}header{display:flex;justify-content:space-between;align-items:end;gap:30px;padding-bottom:22px;border-bottom:1px solid #bfc0bc}.eyebrow{font:12px Consolas,monospace;letter-spacing:.14em;color:#666}h1{font-size:29px;letter-spacing:.04em;margin:10px 0 8px;font-weight:600}.intro{margin:0;color:#656560;font-size:14px;line-height:1.7}.samples{display:flex;gap:5px;flex:none}.samples button{border:0;background:transparent;padding:10px 15px;color:#60605d;font-size:14px}.samples button[aria-pressed=true]{background:#262829;color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:26px}.proposal{min-width:0}.proposal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.letter{font:18px Consolas,monospace;color:#8c8d87}h2{font-size:18px;font-weight:600;margin:0}.stage{height:438px;display:flex;align-items:center;justify-content:center;background:#dededb;overflow:hidden}.preview{background:transparent;border:0;padding:0;text-align:left;color:inherit;transition:transform .15s}.preview:hover{transform:translateY(-5px)}.summary{font-size:13px;line-height:1.75;color:#62625d;margin:14px 2px 0;min-height:46px}.inspect{border:0;border-bottom:1px solid #777;background:none;color:#333;padding:5px 0;margin:6px 2px 0;font-size:13px}
.card{width:260px;height:390px;position:relative;isolation:isolate;overflow:hidden;border-radius:8px;box-shadow:0 8px 16px #0002,0 1px 2px #0002;font-family:"Microsoft YaHei",sans-serif}.art{display:block;width:100%;height:100%;object-fit:cover}.name{font-weight:700;letter-spacing:.05em}.meta{font-size:11px;letter-spacing:.06em}.desc{font-size:15px;line-height:1.65;font-weight:500;margin:0}.cost{font:700 25px/1 Consolas,monospace;display:flex;align-items:center;justify-content:center}.stat{font:700 20px/1.1 Consolas,monospace}.stats{display:flex;justify-content:space-between;align-items:center;font-size:10px}.stats span{display:flex;align-items:baseline;gap:7px}.category{display:flex;align-items:center;gap:6px}.category:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.header{display:flex;align-items:center;justify-content:space-between;gap:8px}.divider{height:1px;background:#d4d5d0;margin:12px 0}
/* A：独立信息区，费用和名称在同一阅读线上。 */
.a{background:#fafaf7;color:#25272a;border:1px solid #c5c7c4;padding:12px}.a .header{height:39px;margin-bottom:10px}.a .name{font-size:22px}.a .cost{width:33px;height:34px;border-left:1px solid #b3b7b6}.a .picture{height:176px;overflow:hidden;border-radius:3px}.a .meta{margin:12px 0 7px;color:#656963}.a .desc{height:72px;overflow:auto}.a .stats{position:absolute;bottom:13px;left:13px;right:13px;padding-top:11px;border-top:1px solid #d5d7d2;color:#626560}.a .stat{color:#26292a}
/* B：画面铺满，文字集中在独立的暗色阅读层。 */
.b{color:#fff;background:#16181b;border:1px solid #5b5e60}.b>.art{position:absolute;inset:0;z-index:-2;object-position:center 25%}.b:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#12151e66 0%,transparent 25%,#10121605 35%,#101216d9 58%,#101216 85%);z-index:-1}.b .topline{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:start}.b .cost{width:35px;height:38px;background:#11171dcc;border:1px solid #fff9;border-radius:4px}.b .meta{color:#e1e5e8;background:#141a22aa;padding:5px 7px}.b .body{position:absolute;left:19px;right:19px;bottom:17px}.b .name{font-size:26px;margin:0 0 12px;display:block}.b .desc{min-height:72px;font-size:15px;color:#edf0f2}.b .stats{margin-top:15px;padding-top:12px;border-top:1px solid #ffffff40;color:#a4b0bb}.b .stat{color:#fff}
/* C：数字单列，卡图与说明占据主阅读列。 */
.c{background:#f8f9f7;color:#212527;display:grid;grid-template-columns:43px 1fr;border:1px solid #c1c6c6;border-radius:3px}.c .rail{background:#252b2e;color:#fff;display:flex;align-items:center;flex-direction:column;padding:17px 0;gap:8px}.c .rail small{font-size:9px;letter-spacing:.05em;color:#bdc6c9}.c .rail .rail-stat{margin-top:auto;display:flex;align-items:center;flex-direction:column;gap:7px}.c .rail .cost{font-size:28px}.c .rail .stat{font-size:23px}.c .content{min-width:0}.c .picture{height:214px;overflow:hidden}.c .copy{padding:14px 14px 9px}.c .name{font-size:22px;margin-bottom:6px;display:block}.c .meta{color:#657075;font-size:10px}.c .desc{font-size:14px;margin-top:12px;height:86px;overflow:auto}
/* D：去掉独立标题横条，留白区承载名称和所有规则。 */
.d{background:#fcfcf9;color:#24292d;border:1px solid #c5c8c5;border-radius:2px;padding:8px}.d .picture{height:202px;position:relative;overflow:hidden}.d .cost{position:absolute;top:10px;left:10px;width:34px;height:34px;background:#fcfcf4;color:#24292d;border-radius:50%;font-size:22px;box-shadow:0 1px 4px #0003}.d .copy{padding:12px 9px}.d .name{font-size:23px}.d .meta{margin-top:5px;color:#777e7a;font-size:10px}.d .desc{font-size:14px;margin-top:12px;height:68px;overflow:auto}.d .stats{position:absolute;bottom:12px;left:17px;right:17px;color:#6a726c}.d .stats span{gap:6px}.d .stat{font-size:17px;color:#262c28}
.research{margin-top:28px;border-top:1px solid #bfc0bc;padding-top:17px;display:flex;align-items:start;justify-content:space-between;gap:22px;font-size:12px;color:#666;line-height:1.8}.research p{margin:0;max-width:690px}.research a{color:#555;text-underline-offset:3px;margin-left:15px}.hint{font-size:12px;color:#777;margin-top:14px}
dialog{padding:24px 36px;border:0;background:#e9e9e7;border-radius:4px;max-width:95vw}dialog::backdrop{background:#13171bd9}dialog .card{transform:scale(var(--preview-scale,1.25));transform-origin:top left}dialog .original-size{width:calc(260px * var(--preview-scale,1.25));height:calc(390px * var(--preview-scale,1.25));overflow:hidden}dialog header{padding:0 0 16px;margin-bottom:20px;align-items:center}dialog h2{font-size:17px}dialog .close{border:0;background:none;font-size:23px;padding:0 4px}dialog p.note{font-size:12px;color:#666;margin:15px 0 0}
</style>
<main>
<header><div><span class="eyebrow">CARD LAYOUT / 01—04</span><h1>卡牌版式 · 四版对比</h1><p class="intro">同一张卡，同一组数值。只比较排版、卡图占比与信息层级。</p></div><nav class="samples" aria-label="卡牌样本"><button data-sample="0" aria-pressed="true">箭雨</button><button data-sample="1" aria-pressed="false">恶魔之力</button><button data-sample="2" aria-pressed="false">青龙化身 · 长文案</button></nav></header>
<div class="grid" id="grid"></div>
<div class="research"><p>将名称、费用、效果分成清楚的阅读层；数字位置固定；装饰缩减为结构线。卡图保留现有插画，先把卡牌做得容易看清。</p><div>参考资料：<a href="https://megacrit.com/news/2024-11-07-neowsletter-issue-4/" target="_blank" rel="noreferrer">Mega Crit · UI调整</a><a href="https://www.playgwent.com/en/news/38255/secrets-of-card-art-design-with-lorenzo-mastroianni" target="_blank" rel="noreferrer">GWENT · 构图过程</a><a href="https://www.playbalatro.com/" target="_blank" rel="noreferrer">Balatro · 卡牌</a></div></div>
<p class="hint">点击任一卡牌可放大查看。四版是待选方案，尚未替换游戏正式卡牌。</p>
</main>
<dialog id="detail"><header><h2 id="detailTitle"></h2><button class="close" aria-label="关闭放大预览">×</button></header><div class="original-size" id="large"></div><p class="note">按 Esc 收回</p></dialog>
<script>
const cards=[
{name:'箭雨',type:'武术',rarity:'古朴',cost:1,attack:-1,value:2,desc:'攻（-1），目标为敌方全体。',art:'assets/cards/martial-tt3-arrow-rain.webp'},
{name:'恶魔之力',type:'法术',rarity:'职业',cost:1,attack:7,value:3,desc:'7′，损失 2 点生命。',art:'assets/cards/spell-cc-demon.webp'},
{name:'青龙化身',type:'能力卡',rarity:'稀有',cost:2,attack:0,value:8,desc:'真龙降世：本局对战中，将‘初始攻击’化为‘青龙偃月斩’。',art:'assets/cards/hero-warrior.webp'}];
const options=[
{key:'a',letter:'A',name:'标准分区',summary:'名称与费用在上，卡图居中，效果独立阅读。信息最容易找。'},
{key:'b',letter:'B',name:'全幅卡图',summary:'插画占据整张卡，文字收在底部暗层。卡图更突出。'},
{key:'c',letter:'C',name:'数字侧栏',summary:'费用、伤害、价值固定在左侧。连续看多张卡时更容易比数值。'},
{key:'d',letter:'D',name:'留白版式',summary:'卡图和文字直接排列，减少横条与标签。整体更轻、更安静。'}];
let current=0;
const art=c=>`<img class="art" src="${c.art}" alt="${c.name}原画">`;
const meta=c=>`<span class="category">${c.type} · ${c.rarity}</span>`;
const stats=c=>`<div class="stats">${c.type==='能力卡'?'<span>战士 · 能力</span>':`<span>${c.type==='法术'?'法伤':'攻击'} <b class="stat">${c.attack}</b></span>`}<span>价值 <b class="stat">${c.value}</b></span></div>`;
function cardHTML(key,c){
 if(key==='a')return `<div class="card a"><div class="header"><span class="name">${c.name}</span><span class="cost" aria-label="费用${c.cost}">${c.cost}</span></div><div class="picture">${art(c)}</div><div class="meta">${meta(c)}</div><p class="desc">${c.desc}</p>${stats(c)}</div>`;
 if(key==='b')return `<div class="card b">${art(c)}<div class="topline"><span class="cost" aria-label="费用${c.cost}">${c.cost}</span><span class="meta">${meta(c)}</span></div><div class="body"><span class="name">${c.name}</span><p class="desc">${c.desc}</p>${stats(c)}</div></div>`;
 if(key==='c')return `<div class="card c"><div class="rail"><small>费用</small><span class="cost">${c.cost}</span><div class="rail-stat">${c.type==='能力卡'?'':`<small>${c.type==='法术'?'法伤':'攻击'}</small><b class="stat">${c.attack}</b>`}<small>价值</small><b class="stat">${c.value}</b></div></div><div class="content"><div class="picture">${art(c)}</div><div class="copy"><span class="name">${c.name}</span><div class="meta">${meta(c)}</div><p class="desc">${c.desc}</p></div></div></div>`;
 return `<div class="card d"><div class="picture">${art(c)}<span class="cost" aria-label="费用${c.cost}">${c.cost}</span></div><div class="copy"><span class="name">${c.name}</span><div class="meta">${meta(c)}</div><p class="desc">${c.desc}</p></div>${stats(c)}</div>`;
}
function render(){document.querySelector('#grid').innerHTML=options.map(o=>`<section class="proposal"><div class="proposal-head"><span class="letter">${o.letter}</span><h2>${o.name}</h2></div><div class="stage"><button class="preview" data-open="${o.key}" aria-label="放大${o.letter}版${cards[current].name}">${cardHTML(o.key,cards[current])}</button></div><p class="summary">${o.summary}</p><button class="inspect" data-open="${o.key}">放大查看 ${o.letter} →</button></section>`).join('');}
document.querySelectorAll('[data-sample]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.sample);document.querySelectorAll('[data-sample]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
const dialog=document.querySelector('#detail');document.querySelector('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;const o=options.find(x=>x.key===b.dataset.open);document.querySelector('#detailTitle').textContent=`${o.letter} · ${o.name} / ${cards[current].name}`;document.querySelector('#large').innerHTML=cardHTML(o.key,cards[current]);dialog.style.setProperty('--preview-scale',Math.min(1.5,(innerHeight-170)/390));dialog.showModal();});
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});render();
</script>
</html>
