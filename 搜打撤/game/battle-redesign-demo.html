<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战斗界面重设计小样 · 对比二游（代号柒）</title>
<style>
/* ════════════════════════════════════════════════════════════════
   战斗界面二游重设计 · 隔离小样（2026-10-15，WF-battle-redesign-1015）
   只读引用既有素材，不接入正式游戏；零常驻循环动画，全部状态驱动。
   借鉴标注见右下「标注」开关。设计稿：docs/evidence/2026-10-15-WF-battle-redesign/
   ════════════════════════════════════════════════════════════════ */
:root{
  --gold:#e6cb76; --gold-deep:#c9a44e; --red:#e0584c; --red-deep:#a83a34;
  --cyan:#5bd7d0; --cyan-deep:#2e8f8c; --purple:#a77bd6;
  --panel:#10161d; --panel2:#151d27; --line:rgba(181,196,205,.22);
  --ink:#e9edef; --ink-dim:#93a7b1; --paper:#efe7d3; --paper-ink:#2a3038;
  --martial:#e0584c; --spell:#5bd7d0; --curse:#a77bd6;
  --fast:.18s cubic-bezier(.33,1,.68,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070a;overflow:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#fit{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a0f14}

/* ── 舞台背景：场景图 + 电影暗角 + 底部渐晕 ─────────────────── */
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) brightness(.86)}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,8,11,.62) 0%,rgba(5,8,11,0) 22%,rgba(5,8,11,0) 58%,rgba(5,8,11,.5) 86%,rgba(5,8,11,.78) 100%),
  radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(4,7,10,.55) 100%)}

/* ── 顶带（36px 作战条）：只剩遭遇标识/波次/余敌/菜单 ────────── */
.topbar{position:absolute;top:0;left:96px;right:0;height:40px;z-index:30;
  display:flex;align-items:center;gap:26px;padding:0 26px;
  background:linear-gradient(180deg,rgba(10,14,19,.92),rgba(10,14,19,.55) 80%,transparent);
  border-bottom:1px solid rgba(230,203,118,.14)}
.topbar .kick{font-size:10px;letter-spacing:.3em;color:var(--gold);font-weight:700}
.topbar .name{font-size:15px;font-weight:700;letter-spacing:.14em}
.topbar .wave{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.topbar .sep{flex:1}
.topbar .foes-left{font-size:13px;font-weight:700;color:#f0b3ac;letter-spacing:.12em}
.topbar .foes-left b{font-size:17px;color:var(--red);font-variant-numeric:tabular-nums}
.chip-mini{font-size:12px;letter-spacing:.1em;color:var(--ink-dim);border:1px solid var(--line);
  padding:3px 10px;background:rgba(16,22,29,.7);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);cursor:pointer;user-select:none}
.chip-mini:hover{color:var(--ink);border-color:rgba(230,203,118,.5)}

/* ── 左缘行动序列栏（星铁·行动条）────────────────────────────── */
.rail{position:absolute;left:0;top:40px;bottom:312px;width:80px;z-index:28;
  background:linear-gradient(90deg,rgba(8,12,17,.93),rgba(8,12,17,.62) 78%,transparent);
  border-right:1px solid rgba(230,203,118,.10);
  display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:12px;
  transition:width .22s cubic-bezier(.33,1,.68,1)}
.rail:hover{width:216px}
.rail .r-round{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700;
  padding:4px 8px;border:1px solid rgba(230,203,118,.35);background:rgba(230,203,118,.08)}
.rail .r-round b{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.rail .r-title{font-size:10px;letter-spacing:.42em;color:var(--ink-dim);margin:2px 0 4px}
.node{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:default}
.node .ava{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;
  border:2px solid rgba(147,167,177,.4);filter:brightness(.52) saturate(.75);
  transition:filter var(--fast),box-shadow var(--fast),border-color var(--fast)}
.node .ava img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.node .lbl{font-size:0;letter-spacing:.04em;color:var(--ink);white-space:nowrap;transition:font-size .18s;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.node .sub{font-size:0;color:var(--ink-dim);white-space:nowrap;transition:font-size .18s;font-variant-numeric:tabular-nums}
.rail:hover .node .lbl{font-size:13px;font-weight:600}
.rail:hover .node .sub{font-size:11px}
.node.me .ava{border-color:var(--gold);filter:none;
  box-shadow:0 0 0 3px rgba(230,203,118,.18),0 0 22px rgba(230,203,118,.28)}
.node.me{order:0}
.node.foe .ava{border-color:rgba(224,88,76,.55)}
.node.foe .sub{color:#d99a93}
.node .glyph{position:absolute;right:-7px;top:1px;font-size:11px;font-weight:800;
  padding:2px 6px;color:#fff;background:var(--red-deep);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.node.acting .ava{filter:none;transform:scale(1.14);
  box-shadow:0 0 0 3px rgba(224,88,76,.25),0 0 26px rgba(224,88,76,.4)}
.rail:hover .node.acting .lbl{color:#ffd9d4}
.rail .r-note{margin-top:auto;margin-bottom:10px;writing-mode:vertical-rl;font-size:0;color:var(--ink-dim);letter-spacing:.4em;transition:font-size .18s}
.rail:hover .r-note{font-size:10px}

/* ── 战场舞台：平台 + 立绘 + 档案签 ──────────────────────────── */
.arena{position:absolute;left:80px;right:0;top:40px;bottom:312px}
.platform{position:absolute;width:280px;height:74px;border-radius:50%;
  background:radial-gradient(50% 62% at 50% 46%,rgba(91,215,208,.3),rgba(91,215,208,.08) 66%,transparent 80%);
  box-shadow:0 26px 40px rgba(0,0,0,.35)}
.platform.foe{background:radial-gradient(50% 62% at 50% 46%,rgba(224,88,76,.32),rgba(224,88,76,.08) 66%,transparent 80%)}
.platform::before{content:"";position:absolute;inset:5px 12px;border-radius:50%;
  border:1px solid rgba(233,237,239,.34)}
.platform::after{content:"";position:absolute;inset:12px 24px;border-radius:50%;
  background:repeating-linear-gradient(45deg,rgba(233,237,239,.07) 0 2px,transparent 2px 10px)}
.figure{position:absolute;width:250px;height:420px;display:flex;align-items:flex-end;justify-content:center;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(3,6,10,.5))}
.figure img{height:100%;object-fit:cover;object-position:50% 12%;
  -webkit-mask-image:radial-gradient(ellipse 52% 60% at 50% 50%,#000 66%,rgba(0,0,0,.3) 86%,transparent 96%);
  mask-image:radial-gradient(ellipse 52% 60% at 50% 50%,#000 66%,rgba(0,0,0,.3) 86%,transparent 96%)}
.figure.foe img{filter:brightness(.86) saturate(.82) contrast(1.04)}
#meFig{left:172px;bottom:64px;z-index:6}
#mePlat{left:168px;bottom:36px}
#foe1Fig{right:236px;bottom:70px;z-index:5}
#foe1Plat{right:232px;bottom:42px}
#foe2Fig{right:540px;bottom:52px;z-index:4}
#foe2Plat{right:536px;bottom:26px}

/* 敌方档案签（信息件：对角切角）+ 意图徽章（单一真源，敌头顶） */
.plate{position:absolute;z-index:8;min-width:196px;padding:10px 14px 11px;
  background:linear-gradient(160deg,rgba(13,19,26,.94),rgba(10,15,21,.9));
  border:1px solid var(--line);border-top:1px solid rgba(224,88,76,.55);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  transform:skewX(0deg)}
.plate .p-name{font-size:20px;font-weight:800;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:baseline;gap:8px}
.plate .p-name small{font-size:11px;color:var(--ink-dim);letter-spacing:.22em;font-weight:600}
.plate .p-hp{height:14px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.plate .p-hp i{position:absolute;inset:0;transform-origin:left;
  background:linear-gradient(90deg,#7e2f2a,var(--red));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.plate .p-hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  padding-right:8px;font-size:11px;color:#fff;font-variant-numeric:tabular-nums;font-weight:700;text-shadow:0 1px 2px #0009}
.plate .p-status{display:flex;gap:6px;margin-top:7px}
.p-st{font-size:11px;font-weight:700;padding:2px 7px;border:1px solid rgba(167,123,214,.45);
  color:#cdb2ea;background:rgba(167,123,214,.12);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.p-st.cold{border-color:rgba(91,215,208,.45);color:#a9e6e2;background:rgba(91,215,208,.1)}
.intent{position:absolute;z-index:9;display:flex;flex-direction:column;align-items:center;gap:0}
.intent .badge{display:flex;align-items:center;gap:8px;padding:7px 16px;
  background:linear-gradient(120deg,var(--red-deep),#8d2f2a);color:#fff;
  font-size:19px;font-weight:800;letter-spacing:.1em;white-space:nowrap;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.45)}
.intent .badge .num{font-size:23px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,255,255,.45)}
.intent .badge.buff{background:linear-gradient(120deg,#8a6a2a,#a8842f)}
.intent .anchor{width:2px;height:22px;background:linear-gradient(180deg,rgba(224,88,76,.95),rgba(224,88,76,.15))}
.intent.lockable .badge{outline:2px solid var(--gold);outline-offset:2px;cursor:pointer}
.intent.lockable:hover .badge{filter:brightness(1.18)}

/* 我方档案（方舟·分段 pip）*/
#mePlate{left:150px;bottom:236px;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:linear-gradient(160deg,rgba(13,19,26,.94),rgba(10,15,21,.9));
  border:1px solid var(--line);border-top:1px solid rgba(230,203,118,.6);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
#mePlate .ava{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);
  box-shadow:0 0 0 3px rgba(230,203,118,.15)}
#mePlate .ava img{width:100%;height:100%;object-fit:cover;object-position:50% 16%}
#mePlate .col{display:flex;flex-direction:column;gap:6px}
#mePlate .p-name{font-size:19px;font-weight:800;letter-spacing:.06em;display:flex;gap:8px;align-items:baseline}
#mePlate .p-name small{font-size:11px;color:var(--ink-dim);letter-spacing:.22em;font-weight:600}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:26px;height:10px;background:rgba(255,255,255,.1);
  clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
.pips i.on{background:linear-gradient(90deg,#2e8f8c,var(--cyan));box-shadow:0 0 8px rgba(91,215,208,.35)}
.pips b{font-size:12px;color:var(--ink-dim);margin-left:8px;font-variant-numeric:tabular-nums}
#mePlate .guard{font-size:12px;font-weight:700;color:#cfd9de;background:rgba(147,167,177,.14);
  border:1px solid rgba(147,167,177,.4);padding:2px 8px;
  clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#mePlate.burst .ava{border-color:#fff3c9;box-shadow:0 0 0 3px rgba(230,203,118,.55),0 0 30px rgba(230,203,118,.65)}
#mePlate .burst-tag{display:none;font-size:11px;font-weight:800;letter-spacing:.2em;color:#1c1503;
  background:linear-gradient(90deg,var(--gold),#f5e2a2);padding:3px 9px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#mePlate.burst .burst-tag{display:inline-block}

/* ── 伤害数字层 / 冲击帧 / 拟声词 ────────────────────────────── */
#fx{position:absolute;inset:0;z-index:40;pointer-events:none}
.dmg{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:34px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.4);
  animation:dmgPop .78s cubic-bezier(.16,1,.3,1) forwards}
.dmg.hit{color:#ffe9d6}
.dmg.crit{color:var(--gold);font-size:52px;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 26px rgba(230,203,118,.6)}
.dmg.hurt{color:#ff8d80}
.dmg.heal{color:#8fe3a8}
.dmg .kana{display:inline-block;margin-right:8px;font-size:.72em;transform:rotate(-6deg);
  color:#fff;background:var(--gold-deep);padding:0 8px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  box-shadow:0 0 22px rgba(230,203,118,.7)}
@keyframes dmgPop{0%{opacity:0;transform:translate(-50%,-30%) scale(1.5)}
  14%{opacity:1;transform:translate(-50%,-52%) scale(1)}
  72%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(.96)}}
#flash{position:absolute;inset:0;z-index:41;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:impactFrame .09s linear}
@keyframes impactFrame{0%{opacity:0}22%{opacity:.55}100%{opacity:0}}
#stage.punch{animation:punch .12s cubic-bezier(.33,1,.68,1)}
@keyframes punch{0%{transform:scale(1)}30%{transform:scale(1.012)}100%{transform:scale(1)}}
.shake{animation:shakeX .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}44%{transform:translateX(7px)}68%{transform:translateX(-4px)}86%{transform:translateX(2px)}}
#dangerVig{position:absolute;inset:0;z-index:39;pointer-events:none;opacity:0;
  background:radial-gradient(108% 92% at 50% 50%,transparent 62%,rgba(224,88,76,.4) 100%)}
#dangerVig.go{animation:dangerPulse 1.1s ease-out}
@keyframes dangerPulse{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* ── 底部指挥台（七圣召唤三段式）────────────────────────────── */
.console{position:absolute;left:0;right:0;bottom:0;height:312px;z-index:26;
  background:linear-gradient(180deg,rgba(9,13,18,.42),rgba(9,13,18,.9) 34%,rgba(7,10,14,.97));
  border-top:1px solid rgba(230,203,118,.22);display:flex;align-items:stretch}
.console::before{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold) 0%,rgba(230,203,118,.55) 34%,rgba(230,203,118,0) 72%);
  opacity:.85}
/* 左段：资源坞 */
.dock{flex:0 0 320px;display:flex;align-items:center;gap:22px;padding:0 26px;
  border-right:1px solid rgba(181,196,205,.1)}
.core{position:relative;width:108px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.core .hex{width:86px;height:96px;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(160deg,rgba(21,42,46,.95),rgba(11,22,26,.95));
  border:1px solid rgba(91,215,208,.4);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  box-shadow:inset 0 0 26px rgba(91,215,208,.16)}
.core .hex b{font-size:44px;font-weight:800;color:#d9f6f4;font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(91,215,208,.55);line-height:1}
.core .hex .lim{position:absolute;right:16px;bottom:16px;font-size:14px;color:var(--ink-dim);font-weight:700}
.core .ring{position:absolute;inset:0}
.core .ring::before,.core .ring::after{content:"";position:absolute;width:20px;height:20px;border:2px solid var(--gold)}
.core .ring::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.core .ring::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.core .pips{gap:5px}
.core .pips i{width:20px;height:7px}
.core .cap{font-size:10px;letter-spacing:.34em;color:var(--cyan);font-weight:700}
.dock .col{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.infuse{padding:9px 12px;background:rgba(13,20,26,.8);border:1px solid var(--line);width:168px}
.infuse .t{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;color:var(--ink-dim);font-weight:700;margin-bottom:6px}
.infuse .t b{color:var(--cyan);font-variant-numeric:tabular-nums}
.infuse .bar{height:8px;background:rgba(255,255,255,.08);clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
.infuse .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan));
  transition:width .5s cubic-bezier(.22,1,.36,1)}
.infuse.full .t b{color:var(--gold)}
.infuse.full .bar i{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.potions{display:flex;flex-direction:column;gap:8px}
.potion{width:168px;font-size:12px;font-weight:700;color:var(--paper-ink);text-align:left;
  background:linear-gradient(120deg,#f3ecd9,#e5dcc2);border:1px solid #c9bd9c;padding:7px 10px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);cursor:pointer;letter-spacing:.06em;
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
.potion small{display:block;font-size:10px;font-weight:600;color:#6c6450;letter-spacing:.14em;margin-top:2px}
.potion:hover{filter:brightness(1.05)}
.potion:active{transform:translateY(1px)}
/* 中段：牌堆 + 手牌甲板 */
.deckzone{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;min-width:0}
.pile{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none}
.pile .pilecard{width:58px;height:82px;border-radius:6px;overflow:hidden;position:relative;
  border:1px solid rgba(233,237,239,.28);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pile.draw .pilecard{transform:rotate(-5deg)}
.pile.gy .pilecard{transform:rotate(4deg);filter:saturate(.5) brightness(.75)}
.pile .pilecard img{width:100%;height:100%;object-fit:cover}
.pile .cnt{font-size:13px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.pile .nm{font-size:10px;letter-spacing:.3em;color:var(--ink-dim)}
/* 手牌甲板（FGO·指令卡）*/
.hand{position:relative;flex:0 1 920px;height:300px;display:flex;justify-content:center;align-items:flex-end}
.hslot{position:relative;width:186px;height:270px;margin:0 -17px;transform-origin:50% 100%;
  transition:transform var(--fast),filter var(--fast),opacity var(--fast);cursor:pointer}
.hslot:nth-child(1){transform:rotate(5.2deg) translateY(26px)}
.hslot:nth-child(2){transform:rotate(2.6deg) translateY(8px)}
.hslot:nth-child(3){transform:rotate(0deg) translateY(0)}
.hslot:nth-child(4){transform:rotate(-2.6deg) translateY(8px)}
.hslot:nth-child(5){transform:rotate(-5.2deg) translateY(26px)}
.hcard{width:100%;height:100%;border-radius:9px;overflow:hidden;position:relative;
  background:linear-gradient(165deg,#f5efdd,#e9e0c6);border:2px solid #b9ab84;
  box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5)}
.hcard .art{position:absolute;left:0;right:0;top:26px;height:148px;overflow:hidden;border-bottom:1px solid #c5b790}
.hcard .art img{width:100%;height:100%;object-fit:cover}
.hcard .nm{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:15px;font-weight:800;
  color:var(--paper-ink);letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.hcard .typ{position:absolute;left:10px;top:29px;font-size:10px;font-weight:700;letter-spacing:.16em;
  padding:2px 7px;color:#fff;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.hcard .desc{position:absolute;left:10px;right:10px;bottom:14px;max-height:64px;overflow:hidden;
  font-size:11px;line-height:1.5;color:#4a4436;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
/* 类型色费用宝石（FGO 首卡语言 → 左上角菱形宝石）*/
.gem{position:absolute;left:-6px;top:34px;width:44px;height:44px;z-index:3;display:flex;align-items:center;justify-content:center;
  transform:rotate(45deg);border:2px solid rgba(255,255,255,.75);
  box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 0 10px rgba(255,255,255,.35)}
.gem b{transform:rotate(-45deg);font-size:21px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gem.martial{background:linear-gradient(135deg,#e0584c,#a83a34)}
.gem.spell{background:linear-gradient(135deg,#5bd7d0,#2e8f8c)}
.gem.curse{background:linear-gradient(135deg,#a77bd6,#6d4a9e)}
.gem.off{background:linear-gradient(135deg,#5a6570,#3c454e);border-color:rgba(255,255,255,.35)}
/* 可打性（方舟·费用点亮）：不可打=整卡下沉压暗 */
.hslot.off .hcard{filter:saturate(.55) brightness(.62)}
.hslot.off{transform:rotate(0) translateY(34px) !important}
.hslot:hover{z-index:20 !important;transform:rotate(0) translateY(-58px) scale(1.07) !important;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.6))}
.hslot:hover .hcard{border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.5),0 0 0 1px rgba(230,203,118,.55)}
.hand.focusmode .hslot:not(:hover){opacity:.78}
.hslot.deal{animation:dealIn .5s cubic-bezier(.22,1,.36,1) backwards}
@keyframes dealIn{0%{opacity:0;transform:translate(-140px,90px) rotate(-14deg)}100%{opacity:1}}
.hslot.selected{transform:rotate(0) translateY(-58px) scale(1.07) !important;z-index:21}
.hslot.deny{animation:shakeX .34s}
.hslot.fly{transition:transform .34s cubic-bezier(.5,0,.8,.4),opacity .34s;opacity:0;z-index:30}
/* 右段：行动钮塔（战双·斜切宣示主钮）*/
.tower{flex:0 0 300px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:12px;
  padding:0 30px;border-left:1px solid rgba(181,196,205,.1)}
#endTurn{width:252px;height:76px;border:0;cursor:pointer;position:relative;
  background:linear-gradient(120deg,#e6cb76,#caa64e 55%,#b18d3d);
  clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%);
  font-size:24px;font-weight:800;letter-spacing:.18em;color:#1c1503;
  box-shadow:0 10px 30px rgba(230,203,118,.28);transition:filter var(--fast),transform var(--fast)}
#endTurn .en{display:block;font-size:10px;letter-spacing:.42em;font-weight:700;color:rgba(28,21,3,.62);margin-top:3px}
#endTurn:hover{filter:brightness(1.09)}
#endTurn:active{transform:translateY(2px)}
#endTurn.wait{opacity:.42;pointer-events:none}
.subchips{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.subchip{width:168px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink);
  background:rgba(16,22,29,.85);border:1px solid var(--line);border-left:3px solid var(--gold);
  padding:8px 14px;text-align:left;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:filter var(--fast)}
.subchip:hover{filter:brightness(1.3)}
/* 连击计数（战双）*/
#combo{position:absolute;right:330px;bottom:290px;z-index:27;display:flex;align-items:center;gap:10px;
  padding:8px 18px;transform:skewX(-8deg);opacity:0;transition:opacity var(--fast);
  background:linear-gradient(120deg,rgba(201,164,78,.92),rgba(154,123,46,.92));color:#241b04;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 8px 22px rgba(0,0,0,.45)}
#combo.on{opacity:1}
#combo .t{font-size:12px;font-weight:800;letter-spacing:.3em}
#combo b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
#combo.pop{animation:comboPop .26s cubic-bezier(.33,1,.68,1)}
@keyframes comboPop{0%{transform:skewX(-8deg) scale(1.16)}100%{transform:skewX(-8deg) scale(1)}}

/* ── 回合横幅（星铁/FGO 入场仪式）───────────────────────────── */
#banner{position:absolute;left:0;right:0;top:44%;z-index:44;display:none;
  flex-direction:column;align-items:center;gap:6px;padding:26px 0 28px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(6,9,13,.92) 18%,rgba(6,9,13,.92) 82%,transparent);
  border-top:1px solid rgba(230,203,118,.4);border-bottom:1px solid rgba(230,203,118,.4)}
#banner.show{display:flex;animation:bannerIn 1.5s cubic-bezier(.22,1,.36,1) forwards}
#banner .k{font-size:13px;letter-spacing:.5em;color:var(--gold);font-weight:700}
#banner .m{font-size:44px;font-weight:800;letter-spacing:.22em;color:#f6f2e6;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#banner.enemy .k{color:#ff9d92}
#banner.enemy .m{color:#ffe3de}
@keyframes bannerIn{0%{opacity:0;clip-path:inset(0 100% 0 0)}12%{opacity:1;clip-path:inset(0 0 0 0)}
  82%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}

/* ── 目标锁定（方舟 lock-on）────────────────────────────────── */
.lockon{position:absolute;z-index:9;width:190px;height:210px;pointer-events:none;opacity:0;transition:opacity var(--fast)}
.lockon::before,.lockon::after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--gold)}
.lockon::before{left:-8px;top:-8px;border-right:0;border-bottom:0}
.lockon::after{right:-8px;bottom:-8px;border-left:0;border-top:0}
.arena.targeting .foe-zone{cursor:pointer}
.arena.targeting .lockon{opacity:1;animation:lockPulse 1.2s ease-in-out 3}
@keyframes lockPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(230,203,118,.2))}50%{filter:drop-shadow(0 0 12px rgba(230,203,118,.75))}}

/* ── 提示 toast ─────────────────────────────────────────────── */
#toast{position:absolute;left:50%;top:220px;transform:translateX(-50%);z-index:46;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toastmsg{padding:10px 22px;background:rgba(12,17,23,.94);border:1px solid rgba(224,88,76,.55);
  color:#ffd9d4;font-size:15px;font-weight:600;letter-spacing:.06em;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);animation:toastIn 1.6s ease forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ── 借鉴标注层 ─────────────────────────────────────────────── */
#ann{position:absolute;inset:0;z-index:48;pointer-events:none;opacity:0;transition:opacity .25s}
#ann.on{opacity:1}
.tag{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;
  background:rgba(8,12,17,.92);border:1px solid var(--gold);padding:5px 11px;
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);white-space:nowrap}
.tag .no{width:18px;height:18px;display:grid;place-items:center;background:var(--gold);color:#1c1503;
  font-size:11px;font-weight:800;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tag .tx{font-size:12px;font-weight:700;color:#f3ead2;letter-spacing:.06em}
.tag .gm{font-size:10.5px;color:var(--cyan);letter-spacing:.1em}
#annLegend{position:absolute;right:18px;top:56px;width:302px;max-height:620px;overflow:auto;
  background:rgba(8,12,17,.95);border:1px solid rgba(230,203,118,.4);padding:16px 18px;pointer-events:auto}
#annLegend h3{font-size:13px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px;font-weight:800}
#annLegend ol{list-style:none;display:flex;flex-direction:column;gap:7px}
#annLegend li{display:flex;gap:8px;font-size:12px;line-height:1.45;color:var(--ink)}
#annLegend li .no{flex:0 0 18px;height:18px;display:grid;place-items:center;background:var(--gold);
  color:#1c1503;font-size:11px;font-weight:800;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
#annLegend li b{color:#fff}
#annLegend li .gm{color:var(--cyan);font-size:11px;margin-left:6px}

/* ── 小样控制条（非设计内容）────────────────────────────────── */
#chrome{position:fixed;right:10px;top:8px;z-index:99;display:flex;gap:7px;align-items:center;
  font-size:11px;color:#7d8f99}
#chrome button{font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer;
  color:#cfe3e8;background:rgba(14,20,26,.86);border:1px solid rgba(147,167,177,.35);padding:4px 11px;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#chrome button.on{background:var(--gold);color:#1c1503;border-color:var(--gold)}
#chrome .hint{margin-right:5px;letter-spacing:.04em;opacity:.85}

/* ── 减少动效 ───────────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){#flash.go,#stage.punch,.hslot.deal{animation:none}}
body.reduce #flash.go,body.reduce #stage.punch,body.reduce .hslot.deal,body.reduce #banner.show{animation:none;opacity:1}
body.reduce #banner.show{display:flex;opacity:1;clip-path:none}
</style>
</head>

    </div>

      <div class="p-name">缚咒者 <small>FOE · 咒使</small></div>

<script>
"use strict";
/* ═══ 状态 ═══ */
const S = {
  round: 2, phase: "player", energy: 2, maxEnergy: 3,
  hp: 24, maxHp: 30, guard: 5,
  infuse: 1, combo: 0, deck: 12, gy: 3,
  foes: {
    foe1: { name:"淬寒猎手", hp:46, max:60, x:.78, y:.30, alive:true },
    foe2: { name:"缚咒者",   hp:30, max:30, x:.68, y:.46, alive:true }
  },
  selected: null, uid: 0
};
const reduce = () => document.body.classList.contains("reduce") ||
  matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═══ 卡池（图用真实卡面素材，数值为演示）═══ */
const POOL = [
  { name:"长剑突刺", type:"martial", cost:1, desc:"造成 6 点攻击伤害。", art:"assets/cards/equip-tt3-longsword.webp", target:"enemy", val:6 },
  { name:"霜结之刃", type:"martial", cost:2, desc:"造成 9 点攻击伤害并施加 1 层冻结。", art:"assets/cards/equip-tt2-frostsword.webp", target:"enemy", val:9 },
  { name:"圣辉抚愈", type:"spell",   cost:1, desc:"回复 4 点生命。", art:"assets/cards/spell-tt7-holyheal.webp", target:"self", val:4 },
  { name:"工兵炸弹", type:"spell",   cost:3, desc:"对目标造成 12 点法术伤害。", art:"assets/cards/equip-tt3-sapper-bomb.webp", target:"enemy", val:12 },
  { name:"缚影咒",   type:"curse",   cost:0, desc:"冻结目标 1 回合。", art:"assets/cards/curse-freeze.webp", target:"enemy", val:0 },
  { name:"疾风连击", type:"martial", cost:1, desc:"造成 4 点攻击伤害，抽 1 张牌。", art:"assets/cards/equip-tt3-immortal-blade.webp", target:"enemy", val:4 },
  { name:"深渊诅咒", type:"curse",   cost:1, desc:"施加 2 层咒纹。", art:"assets/cards/curse-venom.webp", target:"enemy", val:0 }
];
const TYPE = { martial:["武艺 MARTIAL","#e0584c"], spell:["法术 SPELL","#5bd7d0"], curse:["诅咒 CURSE","#a77bd6"] };

/* ═══ 缩放适配 ═══ */
const fit = document.getElementById("fit");
function refit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  fit.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", refit); refit();

/* ═══ 工具 ═══ */
const $ = s => document.querySelector(s);
const stage = $("#stage"), fx = $("#fx"), hand = $("#hand");
function toast(msg){
  const d = document.createElement("div"); d.className="toastmsg"; d.textContent=msg;
  $("#toast").appendChild(d); setTimeout(()=>d.remove(), 1650);
}
function punch(){
  if(reduce()) return;
  stage.classList.remove("punch"); void stage.offsetWidth; stage.classList.add("punch");
}
function impactFrame(){
  if(reduce()) return;
  const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

/* ═══ 渲染：手牌 ═══ */
function affordable(c){ return c.cost <= S.energy; }
function makeCard(c){
  const [tn, tc] = TYPE[c.type];
  const el = document.createElement("div");
  el.className = "hslot deal" + (affordable(c) ? "" : " off");
  el.style.animationDelay = (hand.children.length * 60) + "ms";
  el.dataset.cost = c.cost; el.dataset.uid = ++S.uid;
  el.innerHTML = `
    <div class="gem ${c.type}${affordable(c)?"":" off"}"><b>${c.cost}</b></div>
    <div class="hcard">
      <div class="nm">${c.name}</div>
      <div class="typ" style="background:${tc}">${tn}</div>
      <div class="art"><img src="${c.art}" alt=""></div>
      <div class="desc">${c.desc}</div>
    </div>`;
  el.addEventListener("mouseenter", ()=>{ hand.classList.add("focusmode"); });
  el.addEventListener("mouseleave", ()=>{ hand.classList.remove("focusmode"); });
  el.addEventListener("click", e => { e.stopPropagation(); selectCard(el, c); });
  return el;
}
function dealHand(n=5){
  hand.innerHTML = "";
  for(let i=0;i<n;i++){
    const c = POOL[Math.floor(Math.random()*POOL.length)];
    hand.appendChild(makeCard(c));
    S.deck--; if(S.deck<0) S.deck=0;
  }
  $("#deckN").textContent = S.deck;
}
function selectCard(el, c){
  if(S.phase !== "player") return;
  if(!affordable(c)){
    el.classList.remove("deny"); void el.offsetWidth; el.classList.add("deny");
    toast(`能量不足：需要 ${c.cost}，当前 ${S.energy}`); return;
  }
  if(S.selected){ S.selected.el.classList.remove("selected"); $("#arena").classList.remove("targeting"); }
  if(c.target === "enemy"){
    S.selected = { el, card:c };
    el.classList.add("selected");
    $("#arena").classList.add("targeting");
    toast("选择目标：点击敌方单位");
  } else {
    resolveCard(el, c, null);
  }
}
$(".arena").addEventListener("click", e=>{
  const zone = e.target.closest(".foe-zone");
  if(!zone || !S.selected) return;
  resolveCard(S.selected.el, S.selected.card, zone.dataset.foe);
});

/* ═══ 出牌结算 ═══ */
function dmgNumber(x, y, val, kind){
  const d = document.createElement("div");
  d.className = "dmg " + kind;
  if(kind === "crit") d.innerHTML = `<span class="kana">斬</span>${val}`;
  else d.textContent = (kind === "heal" ? "+" : "-") + val;
  d.style.left = x; d.style.top = y;
  fx.appendChild(d); setTimeout(()=>d.remove(), 820);
}
function foeAnchor(id){
  const f = document.getElementById(id+"Fig");
  return { x: (f.offsetLeft + $("#arena").offsetLeft + f.offsetWidth/2) + "px",
           y: (f.offsetTop + $("#arena").offsetTop + 90) + "px" };
}
function resolveCard(el, c, foeId){
  S.selected = null; $("#arena").classList.remove("targeting");
  el.classList.remove("selected");
  /* 能量与飞行 */
  S.energy = Math.max(0, S.energy - c.cost); renderEnergy();
  const rect = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const sc = 1920 / st.width;
  el.classList.add("fly");
  if(foeId){
    const a = foeAnchor(foeId);
    const tx = (parseFloat(a.x) - (rect.left - st.left)*sc) , ty = (parseFloat(a.y) - (rect.top - st.top)*sc);
    el.style.transform = `translate(${tx}px,${ty}px) scale(.25) rotate(8deg)`;
  } else {
    el.style.transform = "translate(-320px,-140px) scale(.3)";
  }
  setTimeout(()=>el.remove(), 360);
  S.gy++; $("#gyN").textContent = S.gy;

  const crit = c.val > 0 && Math.random() < .22;
  setTimeout(()=>{
    if(foeId && c.val > 0){
      impactFrame(); punch();
      const a = foeAnchor(foeId);
      const foe = S.foes[foeId];
      const total = crit ? Math.round(c.val*1.6) : c.val;
      foe.hp = Math.max(0, foe.hp - total);
      dmgNumber(a.x, a.y, total, crit ? "crit" : "hit");
      const plate = document.getElementById(foeId==="foe1"?"plate1":"plate2");
      plate.classList.remove("shake"); void plate.offsetWidth; plate.classList.add("shake");
      renderFoeHp(foeId);
      if(foe.hp <= 0){ killFoe(foeId); }
    } else if(c.target === "self"){
      S.hp = Math.min(S.maxHp, S.hp + c.val); renderMe();
      const mp = $("#mePlate");
      dmgNumber((mp.offsetLeft + $("#arena").offsetLeft + 90)+"px", (mp.offsetTop + $("#arena").offsetTop)+"px", c.val, "heal");
    }
    /* 连击（战双）*/
    S.combo++;
    if(S.combo >= 2){
      const cb = $("#combo"); $("#comboN").textContent = "×"+S.combo;
      cb.classList.add("on"); cb.classList.remove("pop"); void cb.offsetWidth; cb.classList.add("pop");
    }
    /* 注能（尼克·爆发就绪）*/
    if(S.infuse < 3){ S.infuse++; renderInfuse();
      if(S.infuse === 3){
        const mp = $("#mePlate"); mp.classList.add("burst");
        toast("注能已满 —— 爆发就绪");
      }
    }
    /* 补牌 */
    setTimeout(()=>{
      if(hand.children.length < 5 && S.deck > 0){
        const nc = POOL[Math.floor(Math.random()*POOL.length)];
        const ne = makeCard(nc); ne.classList.remove("deal"); hand.appendChild(ne);
        S.deck--; $("#deckN").textContent = S.deck;
      }
    }, 420);
  }, reduce()?60:300);
}
function killFoe(id){
  const fig = document.getElementById(id+"Fig"), plat = document.getElementById(id+"Plat");
  const plate = document.getElementById(id==="foe1"?"plate1":"plate2");
  const intent = document.getElementById(id==="foe1"?"int1":"int2");
  [fig,plat,plate,intent].forEach(n=>{ if(n) n.style.transition="opacity .5s, filter .5s"; if(n) n.style.opacity=.12; if(n) n.style.pointerEvents="none"; });
  S.foes[id].alive = false;
  const left = Object.values(S.foes).filter(f=>f.alive).length;
  $("#foesLeft").textContent = left;
  document.querySelector(`.node[data-who="${id}"]`).style.opacity = .3;
  if(left === 0) setTimeout(()=>banner("作战完成","VICTORY","player"), 600);
}

/* ═══ 渲染：数值 ═══ */
function renderEnergy(){
  $("#energyN").textContent = S.energy;
  [...$("#energyPips").children].forEach((i,ix)=> i.classList.toggle("on", ix < S.energy));
}
function renderInfuse(){
  $("#infuseN").textContent = S.infuse + "/3";
  $("#infuseBar").style.width = (S.infuse/3*100) + "%";
  $("#infuse").classList.toggle("full", S.infuse >= 3);
}
function renderFoeHp(id){
  const f = S.foes[id];
  document.getElementById(id==="foe1"?"hp1":"hp2").style.transform = `scaleX(${f.hp/f.max})`;
  document.getElementById(id==="foe1"?"hp1n":"hp2n").textContent = f.hp;
}
function renderMe(){
  const seg = 6, per = S.maxHp/seg, lit = Math.ceil(S.hp/per - 1e-6);
  const pips = [...$("#mePips").querySelectorAll("i")];
  pips.forEach((i,ix)=> i.classList.toggle("on", ix < lit));
  $("#mePips").querySelector("b").textContent = S.hp+"/"+S.maxHp;
  document.querySelector('.node.me .sub').textContent = "HP "+S.hp+"/"+S.maxHp;
}

/* ═══ 回合流转 ═══ */
function banner(k, m, mood){
  const b = $("#banner");
  $("#bannerK").textContent = k; $("#bannerM").textContent = m;
  b.className = mood === "enemy" ? "enemy" : ""; b.id = "banner";
  b.classList.add("show");
  setTimeout(()=>b.classList.remove("show"), reduce()?1600:1500);
}
$("#endTurn").addEventListener("click", async ()=>{
  if(S.phase !== "player") return;
  S.phase = "enemy";
  $("#endTurn").classList.add("wait");
  hand.classList.remove("focusmode");
  banner("ENEMY PHASE","敌 方 行 动","enemy");
  document.querySelector(".node.me").classList.remove("acting");
  await wait(reduce()?600:1500);
  /* 行动序列逐个点亮（星铁）*/
  for(const id of ["foe2","foe1"]){
    const f = S.foes[id]; if(!f.alive) continue;
    const nd = document.querySelector(`.node[data-who="${id}"]`);
    nd.classList.add("acting");
    await wait(reduce()?350:650);
    nd.classList.remove("acting");
    if(id === "foe2"){
      const p = document.getElementById("plate2");
      p.classList.add("shake"); setTimeout(()=>p.classList.remove("shake"), 400);
      toast("缚咒者 强化了 淬寒猎手");
      document.querySelector("#int1 .num").textContent = "5";
      document.querySelector('.node[data-who="foe1"] .glyph').textContent = "⚔5";
    } else {
      const dmg = parseInt(document.querySelector("#int1 .num").textContent,10);
      S.hp = Math.max(1, S.hp - dmg); renderMe();
      const mp = $("#mePlate");
      mp.classList.add("shake"); setTimeout(()=>mp.classList.remove("shake"), 400);
      const dv = $("#dangerVig"); dv.classList.remove("go"); void dv.offsetWidth; dv.classList.add("go");
      dmgNumber((mp.offsetLeft+$("#arena").offsetLeft+110)+"px",(mp.offsetTop+$("#arena").offsetTop-10)+"px",dmg,"hurt");
    }
    await wait(reduce()?250:550);
  }
  /* 回到玩家 */
  S.round++;
  document.querySelector(".r-round b").textContent = "R"+S.round;
  S.phase = "player"; S.combo = 0; $("#combo").classList.remove("on");
  S.energy = Math.min(3, S.maxEnergy); renderEnergy();
  banner("PLAYER PHASE · ROUND "+S.round,"你 的 行 动","player");
  document.querySelector(".node.me").classList.add("acting");
  dealHand(5);
  await wait(200);
  $("#endTurn").classList.remove("wait");
});
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ═══ 借鉴标注 ═══ */

  { x:1250,y:270, no:11, tx:"伤害数字体系 + 冲击帧 + 「斬」", gm:"星铁大数字 / 绝区零·冲击帧" },

];
function buildAnn(){
  const layer = $("#ann");
  layer.innerHTML = `<div id="annLegend"><h3>借鉴清单 · 15 处</h3><ol>` +
    ANNS.map(a=>`<li><span class="no">${a.no}</span><span><b>${a.tx}</b><span class="gm">${a.gm}</span></span></li>`).join("") +
    `</ol></div>` +
    ANNS.map(a=>`<div class="tag" style="left:${a.x}px;top:${a.y}px"><span class="no">${a.no}</span><span class="tx">${a.tx.split("：")[0].split("（")[0]}</span><span class="gm">${a.gm.split("·")[0]}</span></div>`).join("");
}
buildAnn();
$("#btnAnn").addEventListener("click", function(){
  this.classList.toggle("on");
  $("#ann").classList.toggle("on");
});
$("#btnMotion").addEventListener("click", function(){
  this.classList.toggle("on");
  document.body.classList.toggle("reduce");
});
$("#btnReset").addEventListener("click", ()=>location.reload());

/* 药水（演示：回复）*/
document.querySelectorAll(".potion").forEach(p=>p.addEventListener("click", ()=>{
  if(p.textContent.includes("生命")){ S.hp = Math.min(S.maxHp, S.hp+8); renderMe(); toast("使用了 生命药剂：回复 8"); }
  else toast("力量药剂：本回合攻击 +2（演示）");
}));

/* ═══ 初始化 ═══ */
renderEnergy(); renderInfuse(); renderMe();
renderFoeHp("foe1"); renderFoeHp("foe2");
dealHand(5);
</script>
