<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无 · 基地小人白底检查</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:#26333b; font:16px/1.6 system-ui,sans-serif; --font-ui:system-ui,sans-serif; }
    header { padding:22px 32px; border-bottom:1px solid #e6eaed; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    h1 { font-size:20px; margin:0; } p { margin:4px 0 0; color:#66737d; font-size:14px; }
    nav { display:flex; gap:8px; }
    nav button { padding:9px 16px; color:#26333b; background:#fff; border:1px solid #ccd5db; border-radius:6px; cursor:pointer; }
    nav button[aria-pressed="true"] { color:#fff; background:#26333b; border-color:#26333b; }
    #hubMain { position:relative; height:calc(100vh - 155px); min-height:600px; overflow:hidden; background:#fff; }
    #hubMain#hubMain .base-chibi-lane { left:8%; right:8%; bottom:65px; height:520px; }
    #hubMain#hubMain .base-chibi { width:360px; height:504px; }
    #hubMain#hubMain .chibi-scale { width:150px; height:210px; inset:auto; bottom:0; left:0; transform-origin:0 100%; transform:scale(2.4); }
    #hubMain#hubMain .chibi-shadow { left:90px; width:180px; height:20px; }
    #hubMain#hubMain .chibi-speech { bottom:100%; }
    #hubMain#hubMain .base-chibi-lane::after { content:""; position:absolute; bottom:0; left:0; right:0; border-top:1px solid #e6eaed; pointer-events:none; }
    footer { padding:12px 32px; border-top:1px solid #e6eaed; color:#66737d; font-size:14px; }
    .chibi-v2-reference { position:absolute; height:540px; width:360px; bottom:72.2px; left:50%; transform:translateX(-50%); }
    nav button:disabled { opacity:.35; cursor:default; }
    .pose-checks { position:absolute; z-index:3; top:128px; left:32px; display:flex; align-items:center; gap:8px; font-size:13px; color:#66737d; }
    .pose-checks button { background:#fff; border:1px solid #d8dfe4; border-radius:5px; padding:7px 11px; color:#374650; cursor:pointer; }
  </style>
</head>
<body>
  <header><div><h1>无 · 基地小人白底检查</h1><p>v2 统一原画 · 同画布分层与动作检查</p></div>
    <nav aria-label="动作切换"><button data-motion="setup" aria-pressed="true">原画</button><button data-motion="rebuild" aria-pressed="false">分层复原</button><button data-motion="idle" aria-pressed="false">待机</button><button data-motion="walk" aria-pressed="false">走路</button><button data-motion="react" aria-pressed="false">点击反应</button></nav>
  </header>
  <aside class="pose-checks" aria-label="姿势检查"><span>定格检查</span><button data-phase="0">落地</button><button data-phase="0.12">下沉</button><button data-phase="0.25">经过</button><button data-phase="0.42">抬起</button><button data-wave-pose>挥手上举</button></aside>
  <main id="hubMain" aria-label="白底动画预览"></main>
  <footer>原画与分层复原可直接对照。点击小人打招呼，悬停时停止走路。此页独立运行，不读取或写入游戏存档。</footer>
  <script type="module" src="./src/ui/chibi-preview.js"></script>
</body>
</html>
