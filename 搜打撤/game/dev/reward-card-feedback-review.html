.fixture-controls{position:absolute;left:30px;top:20px;z-index:10000;background:#111e30;color:white;padding:10px 16px;font:14px sans-serif;display:flex;gap:12px;align-items:center}.fixture-controls button{font:inherit;min-height:32px;padding:6px 12px}.fixture-result{padding:50px;font-size:26px;color:#e5f1ff}body{background:#111c2c}
</style><script>{const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key)}});}</script></head><body>
<div id="app"><main id="viewport"><div id="overlay" class="pick-veil" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><nav class="fixture-controls">领取动效隔离 <button id="normal">普通战利品</button><button id="class">职业箱</button><button id="batch">同名多张</button><button id="failure">失败</button><button id="reduce">减少动态</button><button id="slow">慢速：关</button></nav><div class="card wide chest"><h2 id="ovTitle"></h2><div id="ovBody"></div></div></div></main></div>
<script type="module">
import '/src/ui/ui-scale.js';
import SDT from '/src/core/sdt-facade.js';
import {cardHTML} from '/src/cards/cards.view.js';
const body=document.querySelector('#ovBody'),overlay=document.querySelector('#overlay'),acts={};
const UI={el:{ovBody:body,overlay,ovTitle:document.querySelector('#ovTitle')},showOverlay(title,html){this.el.ovTitle.textContent=title;body.innerHTML=html;overlay.hidden=false;SDT.Icons?.hydrate(body);},hideOverlay(){overlay.hidden=true;},act:(name,fn)=>acts[name]=fn,refresh(){},log(){}};
const cards=['冰刺','冰封千里','极寒长夜中的远行者珍藏护甲','宠物蛋','百炼青虹剑','火球'].map((name,i)=>({id:'fixture'+i,name,type:'法术',rarity:i===3?'史诗':'稀有',cost:1,desc:'静态夹具卡面：冻结目标1回合。',value:2}));
Object.assign(SDT,{UI,Icons:{rich:html=>html,img:()=>'<span aria-hidden="true">❄</span>',TYPE_ART:{}},Sound:{sfx(){}},Cards:{cardHTML,all:()=>cards,RARITIES:['古朴','稀有','史诗','传说'],TYPES:['法术'],NO_COST_TYPES:[],DMG_TYPES:[],rarityOf:c=>c.rarity,isSellable:()=>true,sellPrice:()=>2,infuseAlt:()=>false},Base:{slot:null,data:{},bagCap:()=>16,isSha:()=>false},MAP:{chestKinds:{small:{name:'密封物资箱',pickFrom:3,coins:[2,2]}}}});
const game={seed:1,layerIdx:0,trackPos:1,discoveredPairs:new Set(),state:'modal',ownedCards:[],coins:0,usedSlots:()=>8,bagCap:()=>16,canReceiveCard:()=>true,grantCard(card){this.ownedCards.push({card});return true;},gainCoins(n){this.coins+=n;},persistSave(){}};
SDT.game=game;
await import('/src/core/icons-bitmap.js');
await import('/src/core/art.js');
// The running play session may intentionally disable file watching. Fetch this
// isolated controller fresh and version only its changed presenter dependency.
// All other imports keep their canonical URLs and singleton identity.
const controllerURL = new URL('/src/run/chests.js', location.origin);
const controllerResponse = await fetch(controllerURL + '?review=reward-card-flight-r1');
if (!controllerResponse.ok) throw new Error('Reward fixture controller failed to load');
const controllerSource = (await controllerResponse.text()).replace(/(from\s*['"])((?:\.{1,2}\/|\/)[^'"]+)(['"])/g, (_, prefix, path, suffix) => {
 const url = new URL(path, controllerURL);
 if (url.pathname.endsWith('/reward-scene-view.js')) url.searchParams.set('review', 'multi-chest-receipt-r1');
 return prefix + url.href + suffix;
});
const controllerBlob = URL.createObjectURL(new Blob([controllerSource], {type:'text/javascript'}));
try { await import(/* @vite-ignore */ controllerBlob); } finally { URL.revokeObjectURL(controllerBlob); }
body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)acts[b.dataset.act]?.(b.dataset);});
let failed=false,slow=false;
game.usedSlots=()=>8+game.ownedCards.length;
game.grantCard=card=>{if(failed)return false;game.ownedCards.push({card});return true;};
const {reduceMotion,refreshReduceMotion}=await import('/src/core/motion.js');
function scenario(mode){
 document.dispatchEvent(new Event('sdt-overlay-close'));
 failed=mode==='failure';game.ownedCards=[];game.state='modal';
 const list=mode==='batch'?[cards[0],cards[0],cards[0]]:cards.slice(0,3);
 const reward={kind:'small',cards:list,coins:0,coinsReceived:true,rewardStage:'cards',claimMode:mode==='class'?'one':'all',choiceCount:3,selected:null,taken:[],lost:[]};
 SDT.Chests.restore(game,{version:1,seed:1,layerIdx:0,trackPos:1,queue:[{kind:'small',isClass:mode==='class',reward}],index:1,current:reward,context:{onCell:true},screen:'cards'},()=>{body.innerHTML='<p class="fixture-result">已模拟继续探索</p>';});
}
for(const mode of ['normal','class','batch','failure'])document.getElementById(mode).onclick=()=>scenario(mode);
document.getElementById('reduce').onclick=()=>{localStorage.setItem('sdt-reduce-motion',localStorage.getItem('sdt-reduce-motion')==='1'?'0':'1');refreshReduceMotion();document.getElementById('reduce').textContent=reduceMotion()?'减少动态：开':'减少动态：关';};
const nativeTimeout=window.setTimeout.bind(window),nativeAnimate=Element.prototype.animate;
function preview(fn,scale=slow?4:1){if(scale===1)return fn();const oldTimer=window.setTimeout,oldAnimate=Element.prototype.animate;
 window.setTimeout=(callback,ms,...args)=>nativeTimeout(()=>preview(()=>callback(...args),scale),ms*scale);
 Element.prototype.animate=function(frames,options){return nativeAnimate.call(this,frames,typeof options==='number'?options*scale:{...options,duration:(options?.duration||0)*scale,delay:(options?.delay||0)*scale});};
 try{return fn();}finally{window.setTimeout=oldTimer;Element.prototype.animate=oldAnimate;}}
document.getElementById('slow').onclick=()=>{slow=!slow;document.getElementById('slow').textContent=slow?'慢速：4倍':'慢速：关';};
// Action dispatcher retains the real claim transaction; only its synthetic preview clock changes.
body.addEventListener('click',event=>{const button=event.target.closest('[data-act]');if(!button||button.disabled)return;event.stopImmediatePropagation();preview(()=>acts[button.dataset.act]?.(button.dataset));},true);
function sizeControls(){document.querySelector('.fixture-controls').style.zoom=String(1/SDT.UiScale.scale());}sizeControls();window.addEventListener('resize',sizeControls);
scenario('normal');
</script></body></html>
