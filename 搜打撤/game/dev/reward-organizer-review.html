.fixture-controls{position:absolute;left:30px;top:20px;z-index:10000;background:#111e30;color:white;padding:10px 16px;font:22px sans-serif;display:flex;gap:12px;align-items:center}.fixture-controls button{font:inherit;padding:6px 12px}.fixture-result{padding:50px;font-size:26px;color:#e5f1ff}body{background:#111c2c}
</style></head><body><div class="fixture-controls">隔离夹具 · 不读取/保存游戏档案 <button id="long">16条长列表</button><button id="short">3条短列表</button><span id="result"></span></div>
<div id="app"><main id="viewport"><div id="overlay" class="pick-veil" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="card wide chest"><h2 id="ovTitle"></h2><div id="ovBody"></div></div></div></main></div>
<script type="module">
import '../src/ui/ui-scale.js';
import {openRewardCapacityOrganizer} from '../src/ui/reward-capacity-organizer.js';
const overlay=document.querySelector('#overlay'),body=document.querySelector('#ovBody');
const UI={el:{overlay,ovBody:body},showOverlay(title,html){document.querySelector('#ovTitle').textContent=title;body.innerHTML=html;overlay.hidden=false;}};
let stacks=[],safe=0,active=true;
function reset(count){
 active=true;safe=0;document.querySelector('#result').textContent='';
 stacks=Array.from({length:count},(_,i)=>({card:{name:i===0?'百炼青虹剑':i===1?'坚冰结界':i===2?'极寒长夜中的远行者珍藏护甲':'静态示例卡牌 '+(i+1)},uids:Array.from({length:i===0?3:1},(_,j)=>`fixture-${i}-${j}`),count:i===0?3:1}));
 const full=count;
 const finish=message=>{active=false;body.innerHTML='<p class="fixture-result">'+message+'。可用上方按钮重新打开夹具。</p>';document.querySelector('#result').textContent=message;};
 openRewardCapacityOrganizer({UI,card:{name:'冰封千里'},readStacks:()=>stacks,current:()=>active,
 capacity:()=>`背包 ${stacks.length}/${full} 格 · 安全格 ${safe}/3 格`,canReceive:()=>stacks.length<full,
 moveToSafe(stack){if(safe>=3)return false;stacks=stacks.filter(s=>s!==stack);safe++;return true;},
 discardOne(stack){stack.uids.shift();stack.count--;if(!stack.count)stacks=stacks.filter(s=>s!==stack);return true;},
 onReturn:()=>finish('已返回奖励，夹具整理结果保留'),onClaim:()=>finish('已模拟领取1张'),onFullBag:()=>finish('完整背包兜底入口，仅记录此次点击')});
}
document.querySelector('#long').onclick=()=>reset(16);document.querySelector('#short').onclick=()=>reset(3);
document.addEventListener('keydown',event=>{if(event.key==='Escape')body.querySelector('[data-cancel="true"]')?.click();});
reset(16);
</script></body></html>
