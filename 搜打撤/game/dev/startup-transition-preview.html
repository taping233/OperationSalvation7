<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>启动过场 · 开发预览</title>
  <style>
    :root { --font-ui: 'Microsoft YaHei',sans-serif; --font-mono: monospace; }
    body { margin: 0; background: #080b0e; color: #e1e9eb; font-family: var(--font-ui); }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    nav { position: fixed; bottom: 24px; left: 24px; z-index: 2147483500; display: flex; gap: 12px; padding: 12px; background: #10191fee; }
    button { padding: 10px 18px; color: #e1e9eb; background: #182b33; border: 1px solid #597782; cursor: pointer; }
    body.frozen nav { visibility: hidden; }
  </style>
</head>
<body>
  <iframe src="/" title="真实游戏首页背景"></iframe>
  <nav><button id="play">播放启动过场</button><button id="freeze">定格查看（Esc 返回）</button></nav>
  <script type="module">
    import { installStartupTransition } from '../src/ui/startup-transition.js';
    import { createCityCut, prepareCityCut } from '../src/ui/camp-entry.js';
    import { visualFrame } from '../src/ui/page-visual-ready.js';
    const root = document.documentElement;
    let cleanup;
    document.getElementById('play').onclick = () => {
      cleanup?.();
      document.body.classList.remove('frozen');
      root.dataset.desktopStartup = 'preparing';
      cleanup = installStartupTransition();
    };
    new MutationObserver(() => {
      if (root.dataset.desktopStartup === 'covered') root.dataset.desktopStartup = 'playing';
    }).observe(root, { attributes: true, attributeFilter: ['data-desktop-startup'] });
    document.getElementById('freeze').onclick = async () => {
      cleanup?.();
      const cover = document.createElement('div');
      cover.className = 'desktop-startup-cut page-loading--city';
      const cut = createCityCut({ archive: '城市档案', title: '进入城市', subtitle: 'ENTER THE CITY / 冬日猜想', destination: 'CITY', watermark: 'CITY', scene: 'camp' });
      cut.classList.add('page-cut-waiting');
      cover.append(cut); document.body.append(cover);
      await prepareCityCut(cut);
      await visualFrame();
      cut.classList.remove('page-cut-waiting');
      for (const animation of cover.getAnimations({ subtree: true })) { animation.pause(); animation.currentTime = 320; }
      document.body.classList.add('frozen');
      cleanup = () => cover.remove();
    };
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') { cleanup?.(); document.body.classList.remove('frozen'); }
    });
  </script>
</body>
</html>
