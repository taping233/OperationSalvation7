</style><script>{const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key)}});}</script></head><body>
<div id="app"><main id="viewport"><div id="overlay" class="pick-veil" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><nav class="fixture-controls">真实生成 / 隔离存档 <button id="small">小箱</button><button id="class">职业小箱</button><button id="medium">中箱</button><button id="full">满包小箱</button><button id="room">腾出位置</button><button id="reload">重载奖励</button><button id="legacy">旧三选一</button></nav><div class="card wide chest"><h2 id="ovTitle"></h2><div id="ovBody"></div></div></div></main></div>
<script type="module">
import '/src/ui/ui-scale.js';
import SDT from '/src/core/sdt-facade.js';
import {cardHTML} from '/src/cards/cards.view.js';
import {setRandomService} from '/src/core/random.js';
const map = await (await fetch('/data/map.json?review=small-one-r2')).json();
const body=document.querySelector('#ovBody'),overlay=document.querySelector('#overlay'),acts={};
const UI={el:{ovBody:body,overlay,ovTitle:document.querySelector('#ovTitle')},showOverlay(title,html){this.el.ovTitle.textContent=title;body.innerHTML=html;overlay.hidden=false;SDT.Icons?.hydrate(body);},hideOverlay(){overlay.hidden=true;},act:(name,fn)=>acts[name]=fn,refresh(){},log(){}};
const cards=['冰刺','冰封千里','火球'].map((name,i)=>({id:'fixture'+i,name,type:'法术',rarity:'稀有',cost:1,desc:'隔离测试卡面；生成与领取使用真实宝箱控制器。',value:2}));
const career=cards.map((card,i)=>({...card,id:'class'+i,name:'职业招式'+(i+1),rarity:'职业'}));
let full=false,randomCalls=0,drawCalls=0;
Object.assign(SDT,{UI,Icons:{rich:html=>html,img:()=>'<span aria-hidden="true">❄</span>',TYPE_ART:{}},Sound:{sfx(){}},Cards:{cardHTML,all:()=>cards,RARITIES:['古朴','稀有','史诗','传说'],TYPES:['法术'],NO_COST_TYPES:[],DMG_TYPES:[],rarityOf:c=>c.rarity,isSellable:()=>true,sellPrice:()=>2,infuseAlt:()=>false,classPool:()=>career,randomDropCard:seen=>{drawCalls++;return cards.find(c=>!seen.has(c.id));},pickOfRarity:()=>cards[0]},Base:{slot:null,data:{},bagCap:()=>16,isSha:()=>false,petEggDropChance:()=>0,recordPetEggChestResult(){}},MAP:map});
setRandomService({random:()=>{randomCalls++;return 0.1;},reseed(){},snapshot(){},restore(){}});
const game={seed:1,layerIdx:0,trackPos:1,discoveredPairs:new Set(),state:'idle',myClass:'法术',ownedCards:[],coins:0,usedSlots:()=>full?16:game.ownedCards.length,bagCap:()=>16,canReceiveCard:()=>!full,grantCard(card){if(full)return false;this.ownedCards.push({card});return true;},gainCoins(n){this.coins+=n;},persistSave(){}};
SDT.game=game;
await import('/src/core/icons-bitmap.js');
await import('/src/core/art.js');
const controllerURL=new URL('/src/run/chests.js',location.origin);
const response=await fetch(controllerURL+'?review=small-one-r2');
if(!response.ok)throw new Error('Controller failed to load');
const source=(await response.text()).replace(/(from\s*['"])((?:\.{1,2}\/|\/)[^'"]+)(['"])/g,(_,a,path,b)=>{const url=new URL(path,controllerURL);if(url.pathname.endsWith('/chest-reward-overview.js'))url.searchParams.set('review','small-one-r2');return a+url.href+b;});
const blob=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
try{await import(/* @vite-ignore */ blob);}finally{URL.revokeObjectURL(blob);}
body.addEventListener('click',event=>{const b=event.target.closest('[data-act]');if(b&&!b.disabled)acts[b.dataset.act]?.(b.dataset);});
function scenario(mode){document.dispatchEvent(new Event('sdt-overlay-close'));full=mode==='full';game.ownedCards=[];game.coins=0;game.nodeChestRewards={};game.state='idle';randomCalls=0;drawCalls=0;
 SDT.Chests.open(game,[{kind:mode==='medium'?'medium':'small',isClass:mode==='class'}],()=>{body.innerHTML='<p class="fixture-result">已完成隔离奖励</p>';},{onCell:true});
 if(mode==='legacy'){const save=SDT.Chests.serialize(game);for(const reward of [save.current,save.queue[0].reward])Object.assign(reward,{cards,claimMode:'one',choiceCount:3,rewardStage:'cards'});save.screen='cards';SDT.Chests.restore(game,save,()=>{});}}
for(const mode of ['small','class','medium','full','legacy'])document.getElementById(mode).onclick=()=>scenario(mode);
document.getElementById('room').onclick=()=>{full=false;SDT.Chests.resume();};
document.getElementById('reload').onclick=()=>{const save=JSON.parse(JSON.stringify(SDT.Chests.serialize(game)));SDT.Chests.restore(game,save,()=>{});};
window.smallChestReview={game,counts:()=>({randomCalls,drawCalls}),snapshot:()=>SDT.Chests.serialize(game)};
function sizeControls(){document.querySelector('.fixture-controls').style.zoom=String(1/SDT.UiScale.scale());}sizeControls();window.addEventListener('resize',sizeControls);
scenario('small');
</script></body></html>
