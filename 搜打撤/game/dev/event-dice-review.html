<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>事件投骰 · 内存隔离验收</title>
<script>
const memory = new Map();
Object.defineProperty(window,'localStorage',{value:{getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key)}});
</script>
<script type="module">
const html = await (await fetch('/index.html')).text();
document.open();
document.write(html.replace('<head>','<head><base href="/">').replace('</body>','<script type="module" src="/dev/event-dice-review.js"><\/script></body>'));
document.close();
</script></html>
