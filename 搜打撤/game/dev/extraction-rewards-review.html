.fixture-controls{position:absolute;left:26px;top:10px;z-index:10000;display:flex;flex-wrap:wrap;max-width:calc(100% - 52px);gap:8px;padding:8px 12px;background:#15212df5;color:#eee;font:14px sans-serif}.fixture-controls button{font:inherit;padding:6px 10px}.fixture-controls[hidden]{display:none}.fixture-detail{position:fixed;inset:0;z-index:11000;display:flex;align-items:center;justify-content:center;background:#0d1527e8}.fixture-detail .hs-card{width:420px!important}.fixture-detail button{font:24px sans-serif;color:#eee;background:#253745;border:1px solid #88999c;padding:15px;margin-left:30px}.fixture-detail[hidden]{display:none}
</style></head><body class="page-covered page-opaque"><div class="fixture-controls" id="fixtureControls">展示夹具，确认守卫由单测验证 · 不读写存档 <button id="partial">19待入 / 7空位</button><button id="single">同叠5 / 2空位</button><button id="complete">最终收获</button><button id="none">空奖励</button><button id="full">满仓</button><button id="confirm">余卡确认</button><button id="longConfirm">长清单确认</button><button id="zero">零余卡</button><button id="hide">隐藏工具栏</button></div>
<div id="app"><main id="viewport"><div id="overlay" class="opaque" role="dialog" aria-modal="true"><div class="card page"><h2 id="ovTitle" hidden></h2><div id="ovBody"></div></div></div></main></div><div class="fixture-detail" id="fixtureDetail" hidden></div>
<script type="module">
import SDT,{sdtDefine} from '../src/core/sdt-facade.js';
import '../src/core/icons-bitmap.js';
import '../src/core/art.js';
import '../src/ui/ui-scale.js';
import {rulesSlice} from '../src/cards/cards.rules.js';
import {dataSlice} from '../src/cards/cards.data.js';
import {cardHTML} from '../src/cards/cards.view.js';
import {extractionStashHTML,extractionDoneHTML} from '../src/ui/extraction-rewards-view.js?review=extraction-r3';
import '../css/extraction-rewards.css?review=extraction-r3';
import {createExtractionCommands,buildExtractionReceipt,extractionPocketOutcome} from '../src/hub/extraction.commands.js';
const catalog=Object.values(dataSlice).filter(Array.isArray).flat(),byId=new Map(catalog.map(c=>[c.id,c]));
sdtDefine('Cards',{...rulesSlice,all:()=>catalog,cardHTML});
const pick=id=>{const card=byId.get(id);if(!card)throw Error('Unknown fixture card '+id);return {...card};};
const cards=['tt12-felguard','tt3-azure-sword','tt3-ice-spike','tt2-pearlbox','tt3eq-mistbox','tt12-backupcell','tt4-woodify'].map(pick);
const body=document.querySelector('#ovBody'),detail=document.querySelector('#fixtureDetail');
const initial=cards.map((card,i)=>({card,count:[3,2,2,3,1,5,3][i]}));
let game,base,commands,finalReceipt=null,displayOnly=false,confirmFinish=false;
const count=stacks=>stacks.reduce((n,s)=>n+s.count,0),rarityOf=c=>SDT.Cards.rarityOf(c);
const used=()=>count(base.data.stash),room=()=>Math.max(0,28-used());
function paint(notice=''){
 const pending=game.pendingExtraction;
 const receipt=finalReceipt||buildExtractionReceipt({game,pending,isSha:base.isSha});
 const pocket=pending?extractionPocketOutcome(pending,base.isSha):null;
 const props={remainingCards:pending?.remainingCards||[],savedCards:receipt.savedCards,keptPocket:pocket?.keptCards||[],pocketKept:receipt.netTake.pocketKept,pocketLost:receipt.losses.pocketLost,pocketRuleLost:receipt.losses.pocketRuleLost,wood:receipt.netTake.wood,rations:receipt.netTake.rations,stashUsed:used(),stashCap:28,room:room(),coins:game.coins,shaN:0,starterSha:5,broughtByName:new Map([[cards[1].name,2]]),cardHTML,rarityOf,notice,confirmFinish};
 body.innerHTML=SDT.Icons.rich(finalReceipt?extractionDoneHTML({...props,receipt,baseCoins:12,collectionCount:146,hp:18,maxHp:30}):extractionStashHTML(props));
 if(displayOnly){
  const danger=body.querySelector('[data-act=exConfirmFinish]');
  if(danger)danger.textContent+='（展示不执行）';
  const finishButton=body.querySelector('[data-act=exFinish]');
  if(finishButton&&!pending?.remainingCards.length)finishButton.textContent+='（展示不执行）';
 }
 if(confirmFinish)body.querySelector('[data-act=exCancelFinish]')?.focus();
}
async function deposit(stacks){
 const result=await commands.updateCards(stacks.map(s=>({name:s.card.name,count:s.count})));
 if(!result.ok)throw Error(result.message);
 paint(result.count?`已入库 ${result.count} 张`:'仓库已满');
}
async function finish(){if(displayOnly){paint('仅展示完成状态，不执行结算。');return;}const result=await commands.finish();if(!result.ok)throw Error(result.message);finalReceipt=result.receipt;paint();}
body.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act,i=Number(b.dataset.i);
 const remaining=game.pendingExtraction?.remainingCards||[];
 if(['exInspect','exSavedInspect','exPocketInspect','exDoneInspect'].includes(act)){
  const receipt=finalReceipt||buildExtractionReceipt({game,pending:game.pendingExtraction,isSha:base.isSha});
  const list=act==='exInspect'?remaining:act==='exPocketInspect'?extractionPocketOutcome(game.pendingExtraction,base.isSha).keptCards:receipt.savedCards;
  const card=list[i]?.card;if(!card)return;
  detail.innerHTML=SDT.Icons.rich(cardHTML(card,'lg'))+'<button type="button">返回 · 保留选择</button>';detail.hidden=false;detail.querySelector('button').focus();return;
 }
 if(act==='exStash')await deposit([remaining[i]]);
 if(act==='exAll')await deposit(remaining);
 if(act==='exSmart')await deposit([...remaining].sort((a,b)=>SDT.Cards.sellPrice(b.card)-SDT.Cards.sellPrice(a.card)));
 if(act==='exFinish'){
  if(displayOnly&&remaining.length){confirmFinish=true;paint();}else await finish();
 }
 if(act==='exCancelFinish'){confirmFinish=false;paint();}
 if(act==='exConfirmFinish')paint('展示不执行：卡牌和仓库均未改变。');
 if(act==='goBase')body.innerHTML='<p style="padding:80px;color:white;font-size:36px">隔离流程结束。未连接真实基地或存档。</p>';
});
detail.addEventListener('click',e=>{if(e.target===detail||e.target.closest('button'))detail.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')detail.hidden=true;});
async function reset(mode='partial'){
 displayOnly=['confirm','long','zero'].includes(mode);confirmFinish=mode==='confirm'||mode==='long';
 const stacks=mode==='empty'||mode==='zero'?[]:mode==='long'?Array.from({length:30},(_,i)=>({card:{...cards[i%cards.length],id:'fixture-long-'+i,name:`展示卡牌 ${String(i+1).padStart(2,'0')} · 长清单滚动核验`},count:i%3+1})):mode==='single'?[{card:cards[1],count:5}]:initial;
 finalReceipt=null;detail.hidden=true;
 game={runActive:true,ownedCards:stacks.flatMap(s=>Array.from({length:s.count},()=>({card:{...s.card}}))),inventory:mode==='empty'?[]:[{name:'木材',count:2},{name:'口粮',count:3}],usedPocket:mode==='empty'?[]:[{card:cards[0],count:20},{card:cards[2],count:10}],coins:49,elapsed:1652,turn:75,layerIdx:3,bossKilled:true};
 base={isSha:()=>false,stashCap:()=>28,data:{_m01:{revision:0,requests:{}},wood:0,rations:0,pocket:[],stash:[{card:{name:'往局仓库卡'},count:mode==='full'?28:mode==='single'?26:21}],stats:{extracts:0,bestRunCoins:0,stashTotal:0}}};
 let rolls=0;commands=createExtractionCommands({game,baseApi:base,getActiveSlot:()=>null,random:()=>++rolls%3===0?.9:.1});
 const result=await commands.begin();if(!result.ok)throw Error(result.message);game.pendingExtraction=result.value;paint();
}
document.querySelector('#partial').onclick=()=>reset();document.querySelector('#single').onclick=()=>reset('single');
document.querySelector('#complete').onclick=async()=>{await reset();await deposit([...game.pendingExtraction.remainingCards].sort((a,b)=>SDT.Cards.sellPrice(b.card)-SDT.Cards.sellPrice(a.card)));await finish();};
document.querySelector('#confirm').onclick=()=>reset('confirm');document.querySelector('#longConfirm').onclick=()=>reset('long');document.querySelector('#zero').onclick=()=>reset('zero');
document.querySelector('#none').onclick=()=>reset('empty');document.querySelector('#full').onclick=()=>reset('full');document.querySelector('#hide').onclick=()=>document.querySelector('#fixtureControls').hidden=true;
await reset(new URLSearchParams(location.search).get('case')||'partial');
</script></body></html>
