<script>{const memory=new Map();Object.defineProperty(window,'localStorage',{value:Object.freeze({getItem(key){return memory.get(key)??null},setItem(key,value){memory.set(key,String(value))},removeItem(key){memory.delete(key)},clear(){memory.clear()}})});}</script></head><body>

<div id="app"><main id="viewport"><div id="overlay" class="room-view" role="dialog" aria-modal="true">
<div class="fixture-controls" id="fixtureControls">隔离注能 <button id="fixtureReset">重置</button><button id="fixturePure">纯注能</button><button id="fixtureZero">零材料</button><button id="fixtureMixed">有基础效果</button><button id="fixtureHide">隐藏</button><span id="fixtureResult"></span></div>
<div class="card room"><h2 id="ovTitle" hidden></h2><div id="ovBody"></div></div></div></main></div>
<script type="module">
import SDT,{sdtDefine} from '/src/core/sdt-facade.js';
import '/src/core/icons-bitmap.js';
import '/src/core/art.js';
import '/src/ui/ui-scale.js';
sdtDefine('Sound',{sfx(){},music(){},setDucked(){},setBoss(){}});
sdtDefine('Meta',{track(){}});
sdtDefine('Motion',{reduceMotion:()=>true});
sdtDefine('MAP',{rules:{battleEnergy:9,battleHandMax:99,bossDeckSize:15,starterSha:5,battleStartDraw:5,battleTurnDraw:1},items:{}});
const {UI}=await import('/src/ui/ui.js');
UI.el={overlay:document.querySelector('#overlay'),ovBody:document.querySelector('#ovBody'),ovTitle:document.querySelector('#ovTitle')};
UI.refresh=()=>{}; UI.log=()=>{};
UI.el.ovBody.addEventListener('click',event=>{const button=event.target.closest('[data-act]');if(button&&!button.disabled&&!button.closest('[inert]')) UI._acts[button.dataset.act]?.(button.dataset);});
await import('/src/cards/cards.js');
SDT.Cards.ensureSha(); SDT.Cards.ensureStarters(); SDT.Cards.ensureTabletop(); SDT.Cards.ensureDmgTypes(); SDT.Cards.ensureEffectFields();
const {BattleSession}=await import('/src/battle/core/battle.core.js');
await import('/src/battle/view/battle.view.js?infusion-review=r3');
const C=SDT.Cards.all(); let game;
function reset(kind='default'){
 game={ownedCards:[{uid:'infusion',card:C.find(c=>c.id==='tt3sp-bloodstorm')},...Array.from({length:4},(_,i)=>({uid:'fuel-'+i,card:SDT.Cards.SHA})),...C.filter(c=>['tt3sp-silverthorn','tt12-raydragon','tt7-holyheal','tt3-iceheart-potion','cmtn233trmeg','tt3eq-boiler'].includes(c.id)).map((card,i)=>({uid:'other-'+i,card}))],inventory:[],usedPocket:[],hp:30,maxHp:30,atk:4,spellPower:0,coins:0,myClass:null,state:'idle',battleActive:false,log(){},heal(){},addItem(){},onBattleEnd(){}};
 if(kind !== 'default') game.ownedCards=[{uid:'infusion',card:C.find(c=>c.id===(kind==='mixed'?'tt3sp-silverthorn':'tt12-raydragon'))},...(kind==='zero'?[]:[{uid:'fuel-0',card:SDT.Cards.SHA},{uid:'fuel-1',card:SDT.Cards.SHA}])];
 game.log=(message)=>{document.querySelector('#fixtureResult').textContent=String(message).replace(/<[^>]+>/g,'');};
 sdtDefine('game',game);
 BattleSession.start(game,[0,1].map(i=>({id:'foe-'+i,name:'训练木桩',hp:100,atk:1})),{isBoss:false});
 if(kind!=='zero') BattleSession.commands.beginInfusion('infusion');
}
reset();
document.querySelector('#fixtureReset').onclick=()=>reset();
document.querySelector('#fixturePure').onclick=()=>reset('pure');
document.querySelector('#fixtureZero').onclick=()=>reset('zero');
document.querySelector('#fixtureMixed').onclick=()=>reset('mixed');
document.querySelector('#fixtureHide').onclick=()=>document.querySelector('#fixtureControls').hidden=true;
function sizeControls(){document.querySelector('#fixtureControls').style.zoom=String(1/SDT.UiScale.scale());}
sizeControls();window.addEventListener('resize',sizeControls);
window.infusionFixture={BattleSession,reset};
</script></body></html>
