<style>.fixture-controls{position:fixed;left:8px;top:4px;z-index:20000;display:flex;gap:4px;padding:3px 6px;background:#07121ce8;color:#dce7ed;font:11px sans-serif}.fixture-controls button{font:inherit}.fixture-controls[hidden]{display:none}body{background:#101c28}</style>
<script>Object.defineProperty(window,'localStorage',{value:Object.freeze({getItem(){return null},setItem(){throw new Error('Read-only fixture: save blocked')},removeItem(){throw new Error('Read-only fixture: delete blocked')},clear(){throw new Error('Read-only fixture: clear blocked')}})});</script></head><body>
<div class="fixture-controls" id="fixtureControls">选卡只读夹具 <button data-scene="formation">首脑编组</button><button data-scene="select">手牌选择</button><button data-scene="discover">发现</button><button data-scene="sacrifice">献祭布局</button><button data-scene="restore">复原布局</button><button id="fixtureHide">隐藏</button><span id="fixtureResult"></span></div>
<div id="app"><main id="viewport"><div id="overlay" class="room-view" role="dialog" aria-modal="true"><div class="card room"><h2 id="ovTitle" hidden></h2><div id="ovBody"></div></div></div></main></div>
<script type="module">
import SDT,{sdtDefine} from '/src/core/sdt-facade.js';
import '/src/core/icons-bitmap.js';
import '/src/core/art.js';
import '/src/ui/ui-scale.js';
import {rulesSlice} from '/src/cards/cards.rules.js';
import {dataSlice} from '/src/cards/cards.data.js';
import {cardHTML} from '/src/cards/cards.view.js';
import {createBattleDecisionPresenter} from '/src/battle/view/battle.decision-shell.js';
import {battlePileBodyHTML,pileDetailHTML,battleChoiceBodyHTML,battleHandSelectBodyHTML,battleDiscoverLifecycleNote} from '/src/battle/view/battle.decision-content.js';
import {battleDiscoverBodyHTML} from '/src/battle/view/battle.discover-view.js';
const catalog=Object.values(dataSlice).filter(Array.isArray).flat();
sdtDefine('Cards',{...rulesSlice,all:()=>catalog,cardHTML});
sdtDefine('Sound',{sfx(){}});
sdtDefine('MAP',{rules:{battleEnergy:3,battleStartDraw:5,battleTurnDraw:1,bossDeckSize:15}});
const {UI}=await import('/src/ui/ui.js');
const overlay=document.querySelector('#overlay'),body=document.querySelector('#ovBody'),outer=body.parentElement;
UI.el={overlay,ovBody:body};
UI.showOverlay=(title,html,mode)=>{UI._acts={};outer.className='card '+(mode==='discover'?'discover':'room');overlay.className=mode==='discover'?'discover-view':'room-view';body.innerHTML=SDT.Icons.rich(html);overlay.hidden=false;};
UI.refresh=()=>{};
const {renderDeckSelection}=await import('/src/battle/view/battle.overlays.js');
const snapshot={battleToken:'read-only-fixture',mode:'boss',opts:{isBoss:true},turn:9,energy:3,maxEnergy:3};
const show=createBattleDecisionPresenter({UI,getSnapshot:()=>snapshot,R:()=>({battleEnergy:3})});
const byId=new Map(catalog.map(card=>[card.id,card]));
const pick=id=>{if(!byId.has(id))throw new Error('Missing static card '+id);return structuredClone(byId.get(id));};
const cards=['tt3-wave-slash','tt3-toxin','tt12-felguard','tt12-freezeray','tt12-chargeray','tt12-backupcell','tt4-woodify','tt12-magicfind'].map((id,i)=>({uid:'fixture-'+i,card:pick(id)}));
let activeCards=[];
const result=document.querySelector('#fixtureResult');
function inspect(){UI.act('btDecisionInspect',data=>UI.showCardZoom(activeCards[+data.i],{returnFocus:body.querySelector(`[data-act="btDecisionInspect"][data-i="${+data.i}"]`)}));}
function render(scene){
 result.textContent='';document.querySelector('#cardZoom')?._closeCardZoom?.(true);
 if(scene==='formation'){
  activeCards=cards.map(entry=>entry.card);
  snapshot.deckSelection={cards,selected:[],need:3,max:5,starterCount:5,boss:{name:'编组展示',atk:6,hp:45}};
  renderDeckSelection(snapshot);
  UI.act('bossSel',data=>{const picked=snapshot.deckSelection.selected;const index=picked.indexOf(data.uid);if(index>=0)picked.splice(index,1);else if(picked.length<5)picked.push(data.uid);renderDeckSelection(snapshot);});
  UI.act('bossGo',()=>{result.textContent='只读展示：没有开战或写档';});
  UI.act('bossCancel',()=>render('discover'));inspect();
 }else if(scene==='sacrifice'){
  UI.showOverlay('选择要献祭的卡牌',`<p class="ov-note">选择 3 张卡牌献祭（已选 <b data-sac-count>0</b>）</p><p class="ov-note">仅展示生产卡面与献祭布局，点击不会消耗卡牌。</p><div class="bt-hand sac-hand">${[...cards,...cards].map((entry,i)=>`<button type="button" class="bt-card sac-card" data-act="fixtureSac" data-i="${i}" aria-pressed="false">${cardHTML(entry.card,'sm')}</button>`).join('')}</div><div class="scene-ops"><button class="ov-btn" data-act="fixtureBack">返回</button><button class="ov-btn ok" disabled>确认献祭</button></div>`,'discover');
  UI.act('fixtureSac',data=>{const target=body.querySelector(`[data-act="fixtureSac"][data-i="${data.i}"]`);target.classList.toggle('sel');target.setAttribute('aria-pressed',String(target.classList.contains('sel')));body.querySelector('[data-sac-count]').textContent=body.querySelectorAll('.sac-card.sel').length;});
  UI.act('fixtureBack',()=>render('formation'));
 }else if(scene==='restore'){
  UI.showOverlay('',`<section class="battle-decision pocket-restore"><header class="battle-decision-head"><h3>战地整备 · 复原</h3><span>消耗区</span></header><div class="battle-decision-summary"><p class="ov-note">还可复原 2 张</p><p class="ov-note">只读布局预览，不会复原或写档。</p></div><div class="battle-decision-content pocket-restore-content"><div class="bt-hand fire-restore-hand">${[...cards,...cards].map(entry=>`<button class="bt-card fire-restore-card"><span class="pocket-restore-art">${cardHTML(entry.card,'sm')}</span><span class="pocket-restore-caption"><b>${entry.card.name}</b><span>复原 1 张 · 剩余 2 张</span></span></button>`).join('')}</div></div><footer class="battle-decision-actions"><div class="ov-btns"><button class="ov-btn" data-act="fixtureBack">返回</button></div></footer></section>`,'discover');
  UI.act('fixtureBack',()=>render('formation'));
 }else if(scene==='pile'||scene==='grave'||scene==='empty'){
  const {html,stacks}=battlePileBodyHTML({cards:scene==='empty'?[]:[...cards,cards[0],cards[1]],cardHTML,kind:scene==='grave'?'grave':'deck',isBoss:true});
  show(scene==='grave'?'消耗牌':'剩余牌库',html,true,snapshot);
  UI.act('btInspectPile',data=>{const n=+data.i;body.querySelector('.battle-decision-inspect').outerHTML=pileDetailHTML(stacks[n]);body.querySelectorAll('.battle-pile-card').forEach((b,i)=>{b.classList.toggle('is-inspected',i===n);b.setAttribute('aria-pressed',String(i===n));});});
  UI.act('btDeckBack',()=>{result.textContent='仅关闭夹具';overlay.hidden=true;});UI.act('btGraveBack',UI._acts.btDeckBack);
 }else if(scene==='choice'){
  show('抉择',battleChoiceBodyHTML({cardName:'战术抉择',options:['抽取 2 张牌。','获得 6 点护甲。','造成 3 点伤害，并回复 3 点生命。']}),'discover',snapshot);
  UI.act('btChoicePick',data=>{result.textContent='夹具选择第 '+(+data.i+1)+' 项；未触发游戏结算';});
 }else if(scene==='select'){
  activeCards=cards.slice(0,5).map(entry=>entry.card);
  show('支付代价',battleHandSelectBodyHTML({pool:cards.slice(0,5),handSelecting:{act:'payment',n:2,selectedUids:['already-selected'],mandatory:true,payment:{card:{name:'剑荡妖邪'}}},cardHTML}),'discover',snapshot);
  UI.act('btPickHand',data=>{result.textContent='夹具选中 '+data.uid+'；未消耗游戏卡牌';});inspect();
 }else{
  activeCards=cards.slice(0,3).map(entry=>entry.card);
  show('发现',battleDiscoverBodyHTML({candidates:activeCards.map(card=>({card})),cardHTML,action:'选择 1 张免费施放',remaining:1,source:'江湖救急',note:battleDiscoverLifecycleNote({act:'play',isBoss:true}),pageToken:'fixture'}),'discover',snapshot);
  UI.act('btDiscover',data=>{result.textContent='夹具选择第 '+(+data.i+1)+' 张；未施放游戏卡牌';});inspect();
 }
}
body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)UI._acts[b.dataset.act]?.(b.dataset,b);});
body.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#cardZoom'))document.querySelector('#cardZoom')._closeCardZoom?.();});
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>render(b.dataset.scene));
document.querySelector('#fixtureHide').onclick=()=>{document.querySelector('#fixtureControls').hidden=true;};
render(new URLSearchParams(location.search).get('scene')||'formation');
</script></body></html>
