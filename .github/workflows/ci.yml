name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 搜打撤
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 搜打撤/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: node node_modules/vitest/vitest.mjs run --no-file-parallelism
