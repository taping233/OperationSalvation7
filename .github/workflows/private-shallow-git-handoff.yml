name: Private shallow Git handoff

on:
  push:
    branches:
      - handoff-git-bf612952-1014
    paths:
      - .github/workflows/private-shallow-git-handoff.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fixed source commit
        uses: actions/checkout@v4
        with:
          ref: bf6129520b55e28698c749ce7dbc6d327b85866a
          fetch-depth: 1
          persist-credentials: false

      - name: Export and verify shallow Git repository
        shell: bash
        run: |
          set -euo pipefail
          source_sha=bf6129520b55e28698c749ce7dbc6d327b85866a
          tree_sha=977b69c8236e19ec5d4baabd6b5b26debc33d33a
          bare="$RUNNER_TEMP/private-handoff.git"
          output="$GITHUB_WORKSPACE/handoff-export"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree_sha"
          git branch -f handoff-source "$source_sha"
          git clone --no-local --bare --depth 1 --single-branch --no-tags --branch handoff-source "$GITHUB_WORKSPACE" "$bare"
          test "$(git --git-dir="$bare" rev-parse HEAD)" = "$source_sha"
          test "$(git --git-dir="$bare" rev-parse 'HEAD^{tree}')" = "$tree_sha"
          test "$(git --git-dir="$bare" rev-list --count HEAD)" = 1
          test "$(cat "$bare/shallow")" = "$source_sha"
          test ! -e "$bare/objects/info/alternates"
          test -z "$(find "$bare/objects/pack" -type f -name '*.promisor' -print -quit)"
          test -z "$(find "$bare/objects" -type f ! -path "$bare/objects/pack/*" -print -quit)"
          test -z "$(find "$bare/objects/pack" -type f ! -name '*.pack' ! -name '*.idx' ! -name '*.rev' -print -quit)"
          printf '[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = true\n' > "$bare/config"
          test "$(git config --file "$bare/config" --name-only --list | sort | tr '\n' ' ')" = 'core.bare core.filemode core.repositoryformatversion '
          git --git-dir="$bare" fsck --full --no-reflogs
          mkdir -p "$output"
          entries=(HEAD config shallow refs objects/pack)
          if test -f "$bare/packed-refs"; then entries+=(packed-refs); fi
          tar -C "$bare" -cf "$output/git-bf612952.tar" "${entries[@]}"
          python3 - "$output" "$source_sha" "$tree_sha" <<'PY'
          import hashlib, json, math, pathlib, sys
          output = pathlib.Path(sys.argv[1])
          head, tree = sys.argv[2:]
          archive = output / 'git-bf612952.tar'
          total = archive.stat().st_size
          count = 32
          part_size = math.ceil(total / count)
          assert 0 < part_size <= 24 * 1024 * 1024, 'archive exceeds 32 x 24 MiB limit'
          whole = hashlib.sha256()
          parts = []
          with archive.open('rb') as source:
              for order in range(count):
                  path = output / f'git-bf612952.tar.part{order:02d}'
                  digest = hashlib.sha256()
                  remaining = min(part_size, total - source.tell())
                  assert remaining > 0
                  with path.open('wb') as target:
                      while remaining:
                          data = source.read(min(1024 * 1024, remaining))
                          assert data
                          target.write(data)
                          digest.update(data)
                          whole.update(data)
                          remaining -= len(data)
                  parts.append({'order': order, 'file_name': path.name,
                                'size_bytes': path.stat().st_size,
                                'sha256': digest.hexdigest()})
              assert not source.read(1)
          manifest = {'format': 'ordered-byte-parts-v1', 'source_head': head,
                      'source_tree': tree, 'shallow_head': head,
                      'archive_file_name': archive.name,
                      'archive_size_bytes': total, 'archive_sha256': whole.hexdigest(),
                      'parts': parts}
          (output / 'git-bf612952-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'head': head, 'tree': tree, 'archive_bytes': total,
                            'archive_sha256': whole.hexdigest(), 'part_count': count}))
          PY
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: git-bf612952-part00
          path: handoff-export/git-bf612952.tar.part00
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
