name: Private source sync 9b0fe799
on:
  push:
    branches: [sync/cloud-9b0fe799-20261019]
    paths: [.github/workflows/private-source-sync-9b0fe799.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fixed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: 9b0fe799969b81bd2d6ae7642f36450fd8c1b360
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact tracked source and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9b0fe799969b81bd2d6ae7642f36450fd8c1b360
          test "$(git rev-parse 'HEAD^{tree}')" = 3844cf878a10fb7d3c94537f31bdb8ea0f1f4c16
          mkdir -p sync-export .git/info
          printf '* -export-ignore -export-subst\n' > .git/info/attributes
          git archive --format=tar HEAD | gzip -n -1 > sync-export/source-9b0fe799.tar.gz
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, subprocess
          out = pathlib.Path('sync-export')
          archive = out / 'source-9b0fe799.tar.gz'
          whole = hashlib.sha256()
          parts = []
          with archive.open('rb') as source:
              while data := source.read(24 * 1024 * 1024):
                  n = len(parts)
                  assert n < 64, 'archive exceeds 64-part bound'
                  name = f'source-9b0fe799.tar.gz.part{n:02d}'
                  (out / name).write_bytes(data)
                  whole.update(data)
                  parts.append({'order': n, 'file_name': name, 'size_bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest = {'format': 'ordered-byte-parts-v1', 'source_head': '9b0fe799969b81bd2d6ae7642f36450fd8c1b360', 'source_tree': '3844cf878a10fb7d3c94537f31bdb8ea0f1f4c16', 'archive_file_name': archive.name, 'archive_size_bytes': archive.stat().st_size, 'archive_sha256': whole.hexdigest(), 'parts': parts}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PYTHON
      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: source-9b0fe799-manifest
          path: sync-export/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
