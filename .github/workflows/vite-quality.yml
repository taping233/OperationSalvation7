name: Vite quality gates

on:
  pull_request:
    paths:
      - '.github/workflows/vite-quality.yml'
      - '.github/workflows/ci.yml'
      - '搜打撤/game/**'
      - '搜打撤/narrative/**'
      - '搜打撤/scripts/**'
      - '搜打撤/tests/**'
      - '搜打撤/vite.config.*'
      - '搜打撤/package.json'
      - '搜打撤/package-lock.json'
      - '搜打撤/jsconfig.json'
      - '搜打撤/eslint.config.js'
      - '搜打撤/docs/game-compendium.md'
      - '搜打撤/docs/quality-gates.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/vite-quality.yml'
      - '.github/workflows/ci.yml'
      - '搜打撤/game/**'
      - '搜打撤/narrative/**'
      - '搜打撤/scripts/**'
      - '搜打撤/tests/**'
      - '搜打撤/vite.config.*'
      - '搜打撤/package.json'
      - '搜打撤/package-lock.json'
      - '搜打撤/jsconfig.json'
      - '搜打撤/eslint.config.js'
      - '搜打撤/docs/game-compendium.md'
      - '搜打撤/docs/quality-gates.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 搜打撤/package-lock.json
      - name: Install dependencies
        working-directory: 搜打撤
        run: npm ci
      - name: Build Vite and enforce performance budget
        working-directory: 搜打撤
        run: npm run build
