name: Vite quality gates

on:
  pull_request:
    paths:
      - '.github/workflows/vite-quality.yml'
      - '搜打撤/game/**'
      - '搜打撤/narrative/**'
      - '搜打撤/scripts/**'
      - '搜打撤/tests/**'
      - '搜打撤/vite.config.*'
      - '搜打撤/package.json'
      - '搜打撤/package-lock.json'
      - '搜打撤/docs/game-compendium.md'
      - '搜打撤/docs/quality-gates.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/vite-quality.yml'
      - '搜打撤/game/**'
      - '搜打撤/narrative/**'
      - '搜打撤/scripts/**'
      - '搜打撤/tests/**'
      - '搜打撤/vite.config.*'
      - '搜打撤/package.json'
      - '搜打撤/package-lock.json'
      - '搜打撤/docs/game-compendium.md'
      - '搜打撤/docs/quality-gates.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 搜打撤/package-lock.json
      - name: Install dependencies
        working-directory: 搜打撤
        run: npm ci
      - name: Build Vite
        id: vite
        working-directory: 搜打撤
        run: npm run prebuild && npm exec vite build
      - name: Enforce performance budget
        id: budget
        working-directory: 搜打撤
        run: npm run postbuild
      - name: Record complete build provenance
        id: provenance
        if: ${{ !cancelled() && steps.vite.outcome == 'success' }}
        working-directory: 搜打撤
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        run: node scripts/build-artifact-manifest.mjs
      - name: Preserve private review artifact
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vite-review-${{ github.sha }}
          path: 搜打撤/desktop-app/game/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
